        </div>
      </div>
    ` : `
      <button class="btn block" style="margin-top:14px;" data-action="confirmar-evento-parseado" ${state.relatorioSalvando ? 'disabled' : ''}>
        ${state.relatorioSalvando ? 'Salvando…' : 'Confirmar e criar evento'}
      </button>
    `}
  `;
}

function renderLinhaRevisao(r, i, candidatos) {
  const s = STATUS[r.status];
  return `
    <div class="revisao-row${r.ignorado ? ' ignorado' : ''}">
      <div class="revisao-row-top">
        <div class="revisao-nome">${escapeHtml(r.nomeTexto)} <span style="color:var(--text-muted);">(${escapeHtml(r.grauTexto)})</span></div>
        <div class="revisao-status">${s.emoji} ${s.label}</div>
      </div>
      <div class="revisao-row-bottom">
        ${r.ignorado ? '<span style="color:var(--text-muted); font-size:13px;">Ignorado</span>' : `
          <select data-action="resolver-membro" data-index="${i}">
            <option value="">— selecionar —</option>
            ${candidatos.map(m => `<option value="${m.id}" ${r.membroId === m.id ? 'selected' : ''}>${escapeHtml(m.nome)}${m.grau ? ' (' + escapeHtml(m.grau) + ')' : ''}</option>`).join('')}
          </select>
        `}
        <span class="btn ghost" style="padding:2px 8px; font-size:12px;" data-action="${r.ignorado ? 'reincluir-membro-parseado' : 'ignorar-membro-parseado'}" data-index="${i}">
          ${r.ignorado ? 'Reincluir' : 'Ignorar'}
        </span>
      </div>
      ${!r.ignorado && !r.membroId && r.sugestoes.length ? `
        <div class="revisao-sugestoes">
          ${r.sugestoes.map(m => `<span class="chip-option" data-action="aceitar-sugestao" data-index="${i}" data-id="${m.id}">Quis dizer ${escapeHtml(m.nome)}?</span>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// Usado pelas validacoes de confirmarEventoParseado - o botao "Confirmar"
// fica la embaixo da tela, entao um aviso que so aparece perto do campo
// (ex.: "escolha o tipo") passa batido se a pagina nao rolar sozinha ate lá.
function scrollParaElemento(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function confirmarEventoParseado() {
  if (state.relatorioSalvando) return;
  const parsed = state.relatorioParsed;
  const ev = {
    nome: document.getElementById('rev-evento-nome').value.trim(),
    data: document.getElementById('rev-evento-data').value,
    horario: document.getElementById('rev-evento-horario').value,
    endereco: document.getElementById('rev-evento-endereco').value.trim(),
    outros: document.getElementById('rev-evento-outros').value.trim()
  };
  // Grava direto em parsed.evento antes de qualquer validacao - se render()
  // for chamado de novo daqui pra frente (campo faltando, duplicidade
  // encontrada), os inputs sao reconstruidos a partir de parsed.evento, e
  // sem isso a edicao que a pessoa acabou de fazer no campo se perderia.
  Object.assign(parsed.evento, ev);
  // O botao fica sempre clicavel (nao "disabled" por validacao) porque um
  // botao desabilitado nao avisa nada - a pessoa clica, nada acontece, e o
  // aviso de verdade (ex.: "escolha o tipo") fica la em cima, fora da tela,
  // perto de onde o campo esta. Por isso cada checagem aqui rola a pagina
  // ate o ponto do problema, em vez de so acender um texto que ninguem ve.
  if (!ev.nome) {
    state.relatorioSalvarErro = 'Preencha o nome do evento.';
    render();
    scrollParaElemento('rev-evento-nome');
    return;
  }
  // Data/tipo/integrantes sao os pontos que o evento sempre precisa gravar -
  // o texto colado pode nao trazer a data (como nesse exemplo sem nenhuma
  // data), entao o app exige preencher na mao em vez de salvar em branco.
  if (!ev.data) {
    state.relatorioSalvarErro = 'Preencha a data do evento.';
    render();
    scrollParaElemento('rev-evento-data');
    return;
  }
  if (!parsed.evento.tipo) {
    state.relatorioSalvarErro = 'Escolha o tipo de evento.';
    render();
    scrollParaElemento('rev-secao-tipo');
    return;
  }
  const naoResolvidos = parsed.membrosParsed.filter(r => !r.ignorado && !r.membroId);
  if (naoResolvidos.length) {
    state.relatorioSalvarErro = naoResolvidos.length + ' nome(s) sem correspondência - escolha o membro certo (ou "Ignorar") na lista abaixo.';
    render();
    scrollParaElemento('rev-membros-lista');
    return;
  }
  if (!parsed.membrosParsed.some(r => r.membroId)) {
    state.relatorioSalvarErro = 'Nenhum membro pra salvar - resolva pelo menos um nome antes de confirmar.';
    render();
    scrollParaElemento('rev-membros-lista');
    return;
  }

  const categoria = state.relatorioCategoriaAlvo || state.relatorioEscopo;
  if (!state.relatorioDuplicidadeConfirmada) {
    const duplicatas = eventosPossivelmenteDuplicados(ev.data, categoria, state.relatorioEditandoEventoId);
    if (duplicatas.length) { state.relatorioDuplicidadeAviso = duplicatas; return render(); }
  }
  state.relatorioDuplicidadeAviso = null;

  const membros = parsed.membrosParsed
    .filter(r => !r.ignorado && r.membroId)
    .map(r => ({ id: r.membroId, status: r.status, direto: r.direto, destacado: r.destacado, acompanhado: r.acompanhado }));

  state.relatorioSalvando = true;
  state.relatorioSalvarErro = null;
  render();
  try {
    const r = await apiPost('criarEventoDeTexto', {
      // Vazio quando e uma convocacao nova - o Code.gs cria um id novo
      // sozinho (ver salvarEvento). Quando e uma correcao (ver
      // iniciarCorrecaoConvocacao), manda o id do evento original: o mesmo
      // salvarEvento faz upsert em vez de criar outro, e
      // ajustarParticipantesComStatus substitui a lista de presencas
      // inteira pela nova (adiciona quem entrou, remove quem saiu).
      id: state.relatorioEditandoEventoId || undefined,
      nome: ev.nome, data: ev.data, horario: ev.horario, endereco: ev.endereco, outros: ev.outros,
      // A categoria do evento e a divisao escolhida na tela de colar
      // (relatorioCategoriaAlvo), nao o escopo de acesso (relatorioEscopo) -
      // um organizador Regional pode estar colando a convocacao so da
      // Curicica, e o evento tem que nascer como categoria "curicica".
      categoria: categoria, tipo: parsed.evento.tipo || '',
      // A lista colada ja e o resultado final (quem foi, quem faltou) - o
      // evento nasce encerrado, sem precisar que o organizador va la depois
      // so pra clicar em "Encerrar". Isso tambem faz a % de presenca do
      // membro contar esse evento na hora (so eventos encerrados entram na
      // conta, ver lerEstatisticasMembros no Code.gs).
      status: 'encerrado',
      membros: membros,
      // Guardado pra dar pra conferir depois exatamente o que foi colado,
      // sem depender do WhatsApp - ver "Ver texto original" em renderCardEvento.
      textoOriginal: state.relatorioTextoBruto
    });
    state.relatorioSalvoEventoId = r.id;
    // Se for uma correcao, o evento ja tinha presencas cacheadas em
    // state.reportData de antes - loadReportData() so busca o que "falta"
    // (id ainda nao presente no cache), entao sem apagar a entrada antiga
    // aqui o Resumo continuaria mostrando os numeros de antes da correcao
    // ate a pagina ser recarregada inteira.
    delete state.reportData[r.id];
    await loadInitial();
    state.relatorioColarStep = 'resultado';
  } catch (e) {
    state.relatorioSalvarErro = e.message;
  }
  state.relatorioSalvando = false;
  render();
}

function conteudoRelatorioResultado() {
  const ev = state.events.find(e => e.id === state.relatorioSalvoEventoId);
  if (!ev) {
    return `
      <div class="card"><div class="empty">Não encontrei o evento recém-criado na lista — confira na aba Eventos.</div></div>
      <button class="btn block" data-action="go-home">Ir para a tela inicial</button>
    `;
  }
  const statusPorMembro = {};
  (state.relatorioParsed ? state.relatorioParsed.membrosParsed : []).forEach(r => {
    if (r.membroId) statusPorMembro[r.membroId] = r.status;
  });
  const groups = { confirmado: [], familia: [], trabalho: [], aguardando: [], justificada: [], infracional: [] };
  ev.memberIds.forEach(mid => {
    const m = state.roster.find(r => r.id === mid);
    if (!m) return;
    const st = statusEfetivo(ev, statusPorMembro[mid] || 'aguardando');
    (groups[st] || groups.aguardando).push(m.nome);
  });
  const total = ev.memberIds.length;
  const pct = total ? Math.round((groups.confirmado.length / total) * 100) : 0;

  return `
    <div style="font-weight:600; font-size:15px; margin-bottom:10px;">✅ Evento ${state.relatorioEditandoEventoId ? 'corrigido' : 'criado'}: ${escapeHtml(ev.nome)}</div>
    <div class="card">
      <div class="info-line"><b>${pct}% de presença</b> (${groups.confirmado.length} de ${total})</div>
      <div class="info-line">✅ Confirmados: ${groups.confirmado.length}</div>
      ${ev.status !== 'encerrado' ? `<div class="info-line">⚠️ Aguardando: ${groups.aguardando.length}</div>` : ''}
      <div class="info-line">❌ Faltas justificadas: ${groups.familia.length + groups.trabalho.length + groups.justificada.length}</div>
      <div class="info-line">⭕ Faltas infracionais (inclui quem não respondeu): ${groups.infracional.length}</div>
      ${groups.infracional.length ? `<div class="info-line" style="white-space:pre-wrap; color:var(--text-muted);">${groups.infracional.map(n => '- ' + n).join('\n')}</div>` : ''}
    </div>
    <div class="row-gap" style="margin-top:14px;">
      <button class="btn" data-action="open-event" data-id="${ev.id}">Ver evento</button>
      <button class="btn secondary" data-action="nova-convocacao">Colar outra convocação</button>
    </div>
  `;
}

// Todos os eventos da divisao/Regional escolhida na tela de Relatorios -
// tanto os criados colando convocacao quanto os que ja existiam antes
// (criados pelo Modo organizador), ja que sao o mesmo tipo de registro. No
// Regional (unica chave-mestra), respeita o filtro de divisao escolhido no
// topo do painel: 'todas' junta tudo (inclusive convocacoes coladas em nome
// de uma divisao especifica, que "sumiam" do resumo Regional antes disso
// existir), uma chave especifica mostra so os eventos daquela categoria -
// 'regional' inclusive, pros eventos que sao da Regional mesmo.
function eventosDoRelatorioEscopo() {
  return state.events
    .filter(e => {
      if (state.relatorioEscopo !== 'regional') return e.categoria === state.relatorioEscopo;
      return state.relatorioFiltroDivisao === 'todas' || e.categoria === state.relatorioFiltroDivisao;
    })
    .sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.criadoEm || '').localeCompare(a.criadoEm || ''));
}

// Roster visivel no painel de Relatorios, respeitando o mesmo filtro de
// divisao de eventosDoRelatorioEscopo() - usado pelas abas fixas de tipo
// ("% de cada integrante em X"), onde faz sentido restringir a lista de
// nomes tambem, nao so os eventos.
function membrosVisiveisRelatorio() {
  if (state.relatorioEscopo !== 'regional') {
    const nomeEscopo = escopoPorChave(state.relatorioEscopo).nome;
    return state.roster.filter(m => m.divisao === nomeEscopo);
  }
  if (state.relatorioFiltroDivisao === 'todas') return state.roster;
  const nomeFiltro = escopoPorChave(state.relatorioFiltroDivisao).nome;
  return state.roster.filter(m => m.divisao === nomeFiltro);
}

function renderCardEvento(ev) {
  const pct = ev.status === 'encerrado' && state.reportData[ev.id]
    ? (() => { const c = computeCounts(ev); const total = ev.memberIds.length;
                return total ? Math.round((c.confirmado / total) * 100) : 0; })()
    : null;
  const textoAberto = state.relatorioTextoOriginalExpandido.has(ev.id);
  const confirmandoExclusao = state.confirmDeleteId === ev.id;
  const cor = corTipoEvento(ev.tipo);
  // Mesma arte de fundo por tipo da tela "Escolha o tipo de evento" - a
  // classe tipo-* (cor solida) so entra se ainda nao tiver imagem pra esse
  // tipo (ver TIPO_HOME_IMAGEM).
  const imagemFundo = TIPO_HOME_IMAGEM[ev.tipo];
  const estiloFundo = imagemFundo
    ? `background-image:url('${imagemFundo}'); background-size:cover; background-position:center; border-left:3px solid ${cor};`
    : '';
  return `
    <div class="card event-card ${imagemFundo ? '' : classeTipoEvento(ev.tipo)}" style="${estiloFundo}" data-action="open-event" data-id="${ev.id}">
      <div style="min-width:0; flex:1;">
        <div style="display:flex; align-items:center; gap:14px;">
          ${ev.tipo ? `<div class="tipo-home-icone" style="border-color:${cor}; flex-shrink:0;">${emojiTipoEvento(ev.tipo)}</div>` : ''}
          <div style="min-width:0;">
            <div class="name">${escapeHtml(ev.nome)}</div>
            <div class="meta">${ev.data ? formatDataBR(ev.data) + ' · ' : ''}${ev.status === 'encerrado' ? 'Encerrado' : 'Ativo'}${pct !== null ? ' · ' + pct + '% presença' : ''}</div>
          </div>
        </div>
        <div style="margin-top:8px; display:flex; gap:14px; flex-wrap:wrap;">
          ${ev.status === 'encerrado' ? `<div class="btn ghost" style="padding:2px 0; font-size:12px;" data-action="corrigir-convocacao" data-id="${ev.id}">✏️ Corrigir</div>` : ''}
          ${ev.textoOriginal ? `<div class="btn ghost" style="padding:2px 0; font-size:12px;" data-action="toggle-texto-original" data-id="${ev.id}">${textoAberto ? '📄 Esconder texto original' : '📄 Ver texto original'}</div>` : ''}
          <div class="btn ghost" style="padding:2px 0; font-size:12px;" data-action="ask-delete-event" data-id="${ev.id}">🗑️ Excluir</div>
        </div>
        ${textoAberto ? `<pre class="texto-original-pre" data-action="ignore-click">${escapeHtml(ev.textoOriginal)}</pre>` : ''}
        ${confirmandoExclusao ? `
          <div class="alert" data-action="ignore-click" style="margin-top:10px;">
            <div class="alert-title">Excluir "${escapeHtml(ev.nome)}"?</div>
            <div class="alert-msg">Apaga o evento e as confirmações de todos os membros. Não dá para desfazer.</div>
            <div class="row-gap" style="margin-top:10px;">
              <button class="btn danger" data-action="delete-event" data-id="${ev.id}">Sim, excluir</button>
              <button class="btn secondary" data-action="cancel-delete-event">Cancelar</button>
            </div>
          </div>
        ` : ''}
      </div>
      <div class="arrow">›</div>
    </div>
  `;
}

// Lista de eventos agrupada por divisao - so faz sentido no Regional com
// "Todas as divisões", onde os eventos vem de categorias diferentes e senao
// nao da pra saber de qual divisao e cada um so olhando o nome. Mesmo
// padrao visual/comportamento (cabecalho recolhivel, comeca fechado) de
// renderListaEstatisticasPorDivisao.
function renderEventosAgrupados(eventos) {
  const porDivisao = {};
  eventos.forEach(ev => {
    const nomeDivisao = escopoPorChave(ev.categoria).nome;
    (porDivisao[nomeDivisao] = porDivisao[nomeDivisao] || []).push(ev);
  });
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return `
    <div class="card" style="padding: 4px 16px;">
      ${ordenadas.map(divisao => {
        const itens = porDivisao[divisao];
        const aberto = state.relatorioEventosExpandidos.has(divisao);
        return `
          <div class="division-subheader clicavel" data-action="toggle-relatorio-eventos-divisao" data-value="${escapeHtml(divisao)}">
            <span>${aberto ? '▾' : '▸'} ${escapeHtml(divisao.toUpperCase())}</span>
            <span class="division-counts">${itens.length} ${itens.length === 1 ? 'evento' : 'eventos'}</span>
          </div>
          ${aberto ? itens.map(renderCardEvento).join('') : ''}
        `;
      }).join('')}
    </div>
  `;
}

function conteudoRelatorioEventos() {
  const eventos = eventosDoRelatorioEscopo();
  if (!eventos.length) return '<div class="empty">Nenhum evento ainda nessa divisão.</div>';
  const agrupar = state.relatorioEscopo === 'regional' && state.relatorioFiltroDivisao === 'todas';
  return `
    ${state.reportError ? `
      <div class="alert" style="margin-bottom:14px;">
        <div class="alert-title">Não consegui carregar a % de alguns eventos</div>
        <div class="alert-msg">${escapeHtml(state.reportError)}.</div>
        <button class="btn secondary block" data-action="retry-relatorio-eventos" style="margin-top:10px;">Tentar de novo</button>
      </div>
    ` : ''}
    ${agrupar ? renderEventosAgrupados(eventos) : `
      <div class="card" style="padding: 4px 16px;">
        ${eventos.map(renderCardEvento).join('')}
      </div>
    `}
  `;
}

// yyyy-MM-dd de N meses atras, no fuso local - mesma ideia de dataCorte no
// Code.gs, so que calculada no navegador (aqui nao precisamos ler a
// planilha de novo, so filtrar o que ja esta em state.events/reportData).
function dataCorteMeses(meses) {
  const d = new Date();
  d.setMonth(d.getMonth() - meses);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const RELATORIO_PERIODOS = [1, 3, 6, 12];

// Donut de status em SVG puro (sem biblioteca) - um anel por segmento,
// usando stroke-dasharray/dashoffset; numero central + legenda com
// swatch+valor, pra identidade nunca depender so da cor (segue a mesma
// regra de acessibilidade das outras telas do app). "centro"/"centroLabel"
// ficam sobrepostos ao SVG num div posicionado por cima.
function renderDonutChart(segments, centro, centroLabel, tamanho) {
  tamanho = tamanho || 120;
  const total = segments.reduce((s, x) => s + x.value, 0);
  const cx = tamanho / 2, cy = tamanho / 2, espessura = Math.round(tamanho * 0.133), r = cx - espessura / 2 - 2;
  const C = 2 * Math.PI * r;
  let acumulado = 0;
  const comDados = segments.filter(s => s.value > 0);
  const arcos = total && comDados.length ? comDados.map(s => {
    const frac = s.value / total;
    const arco = `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${s.cor}" stroke-width="${espessura}"
        stroke-dasharray="${(frac * C).toFixed(2)} ${C.toFixed(2)}"
        stroke-dashoffset="${(-acumulado * C).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"></circle>
    `;
    acumulado += frac;
    return arco;
  }).join('') : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--surface-alt)" stroke-width="${espessura}"></circle>`;
  const fonteCentro = Math.round(tamanho * 0.183), fonteLabel = Math.round(tamanho * 0.075);

  return `
    <div class="donut-wrap">
      <div style="position:relative; width:${tamanho}px; height:${tamanho}px; flex-shrink:0;">
        <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 ${tamanho} ${tamanho}">${arcos}</svg>
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;">
          <div style="font-size:${fonteCentro}px; font-weight:700; color:var(--white-strong); line-height:1;">${escapeHtml(String(centro))}</div>
          <div style="font-size:${fonteLabel}px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:3px;">${escapeHtml(centroLabel)}</div>
        </div>
      </div>
      <div class="donut-legend">
        ${segments.map(s => `
          <div class="donut-legend-item">
            <span class="donut-swatch" style="background:${s.cor};"></span>
            <span class="donut-legend-label">${escapeHtml(s.label)}</span>
            <span class="donut-legend-value">${s.value}${total ? ' · ' + Math.round(s.value / total * 100) + '%' : ''}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Status agrupado em 4 fatias (confirmado/aguardando/faltas justificadas/
// faltas infracionais) para o donut - familia+trabalho+justificada viram
// uma unica fatia, igual ao que buildReportText ja agrupa.
// So 3 fatias - eventos encerrados nunca deveriam ter "Aguardando" de
// verdade (ver statusEfetivo), entao esse status nem entra no donut.
function segmentosDonutStatus(statusPeriodo) {
  return [
    { label: 'Confirmado', value: statusPeriodo.confirmado, cor: 'var(--status-confirmado)' },
    { label: 'Faltas justificadas', value: statusPeriodo.justificada, cor: 'var(--status-justificada)' },
    { label: 'Faltas infracionais', value: statusPeriodo.infracional, cor: 'var(--status-infracional)' },
  ];
}

// Quem mais acumulou falta infracional num periodo - separado do "% de cada
// integrante" (que mistura confirmado/aguardando/faltas justificadas na
// mesma media) porque infracional e o dado que interessa pra acao
// disciplinar, e fica diluido demais dentro de uma % geral.
function rankingFaltasInfracionais(encerrados, meses) {
  const corte = dataCorteMeses(meses);
  const porMembro = {};
  encerrados.forEach(ev => {
    if (!ev.data || ev.data < corte) return;
    const statusData = state.reportData[ev.id];
    if (!statusData) return;
    ev.memberIds.forEach(mid => {
      const s = statusEfetivo(ev, (statusData[mid] && statusData[mid].status) || 'aguardando');
      if (s === 'infracional') porMembro[mid] = (porMembro[mid] || 0) + 1;
    });
  });
  return Object.keys(porMembro)
    .map(id => {
      const m = state.roster.find(r => r.id === id);
      return { id, nome: m ? m.nome : id, divisao: m ? m.divisao : '', total: porMembro[id] };
    })
    .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
}

// Painel opcional acima de "% de cada integrante", no mesmo periodo
// escolhido pro card "Presenca total" (ver renderDonutCard) - some sozinho
// quando ninguem tem falta infracional no periodo, pra nao virar um card
// vazio disputando espaco com o resto do resumo.
function renderRankingFaltasInfracionais(encerrados) {
  const meses = state.relatorioPeriodoPorGrafico.total || 3;
  const mostrarDivisao = state.relatorioEscopo === 'regional' && state.relatorioFiltroDivisao === 'todas';
  const ranking = rankingFaltasInfracionais(encerrados, meses).filter(r => r.total > 0).slice(0, 8);
  if (!ranking.length) return '';
  return `
    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:2px;">⚠️ Mais faltas infracionais</div>
      <div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">Últimos ${meses === 1 ? 'mês' : meses + ' meses'}</div>
      ${ranking.map(r => `
        <div class="info-line" style="display:flex; justify-content:space-between; align-items:center;">
          <span>${escapeHtml(r.nome)}${mostrarDivisao && r.divisao ? ` <span style="color:var(--text-muted); font-size:11.5px;">· ${escapeHtml(r.divisao)}</span>` : ''}</span>
          <span style="font-weight:700; color:var(--status-infracional);">${r.total}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// Resumo de um grafico (chave = 'total' ou um TIPOS_EVENTO) numa janela de
// meses: soma por status (pro donut), % geral e a lista de eventos que
// entraram na conta (pro drill-down em "Ver eventos").
function resumoDonutPeriodo(encerrados, chave, meses) {
  const corte = dataCorteMeses(meses);
  const doGrupo = encerrados.filter(ev => chave === 'total' || ev.tipo === chave);
  let somaConfirmados = 0, somaConvidados = 0, eventosNoPeriodo = 0, faltaCarregar = false;
  const statusPeriodo = { confirmado: 0, aguardando: 0, justificada: 0, infracional: 0 };
  const itens = [];
  doGrupo.forEach(ev => {
    if (!ev.data || ev.data < corte) return;
    if (!state.reportData[ev.id]) { faltaCarregar = true; return; }
    const c = computeCounts(ev);
    const total = ev.memberIds.length;
    somaConfirmados += c.confirmado;
    somaConvidados += total;
    eventosNoPeriodo++;
    statusPeriodo.confirmado += c.confirmado;
    statusPeriodo.aguardando += c.aguardando;
    statusPeriodo.justificada += c.familia + c.trabalho + c.justificada;
    statusPeriodo.infracional += c.infracional;
    itens.push({ ev, confirmado: c.confirmado, total, pct: total ? Math.round((c.confirmado / total) * 100) : null });
  });
  itens.sort((a, b) => (b.ev.data || '').localeCompare(a.ev.data || ''));
  return {
    pct: somaConvidados ? Math.round((somaConfirmados / somaConvidados) * 100) : null,
    statusPeriodo, somaConfirmados, somaConvidados, eventosNoPeriodo, itens, faltaCarregar
  };
}

// Um card do painel: titulo, chips de periodo proprios, donut e a contagem
// de eventos embaixo - "total" vem maior e centralizado (destaque = true).
// Linha de tendencia (sparkline) em SVG puro - mesma tecnica de
// stroke-dasharray/path do donut, sem lib nenhuma. So conecta pontos com %
// valido (eventos ainda sem reportData carregado ficam de fora da linha em
// vez de virar um buraco em 0%, que mentiria sobre a presenca). Usada so no
// card "Presença total" (destaque) - nos 4 cards de tipo, lado a lado num
// grid pequeno, o grafico ficaria pequeno demais pra informar algo.
function renderSparklineTendencia(itens) {
  const cronologico = itens.slice().sort((a, b) => (a.ev.data || '').localeCompare(b.ev.data || ''));
  const validos = cronologico.filter(x => x.pct !== null);
  if (validos.length < 2) return '';

  const largura = 280, altura = 56, margem = 6;
  const n = cronologico.length;
  const pontos = cronologico.map((x, i) => ({
    x: n > 1 ? margem + (i / (n - 1)) * (largura - margem * 2) : largura / 2,
    y: x.pct === null ? null : altura - margem - (x.pct / 100) * (altura - margem * 2),
    pct: x.pct, nome: x.ev.nome, data: x.ev.data
  }));

  let caminho = '';
  pontos.forEach(p => { if (p.y !== null) caminho += (caminho ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' '; });
  const bolinhas = pontos.filter(p => p.y !== null).map(p => `
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--white-strong)">
      <title>${escapeHtml(p.nome)}${p.data ? ' — ' + formatDataBR(p.data) : ''}: ${p.pct}%</title>
    </circle>
  `).join('');

  return `
    <div style="margin-top:10px;">
      <svg width="100%" height="${altura}" viewBox="0 0 ${largura} ${altura}" preserveAspectRatio="none" style="display:block;">
        <path d="${caminho.trim()}" fill="none" stroke="var(--white-strong)" stroke-width="1.5"></path>
        ${bolinhas}
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); margin-top:2px;">

// Conta convites/confirmacoes por membro a partir de uma lista de eventos ja
// filtrada (por tipo, por periodo, o que for) - motor comum de
// estatisticasMembrosPorTipo e estatisticasMembrosPorPeriodo, pra nao
// duplicar o mesmo loop com filtro diferente por fora.
function contarConfirmacoesPorMembro(eventos) {
  const contagem = {};
  eventos.forEach(ev => {
    const presencas = state.reportData[ev.id];
    if (!presencas) return;
    ev.memberIds.forEach(mid => {
      if (!contagem[mid]) contagem[mid] = { convites: 0, confirmacoes: 0 };
      contagem[mid].convites++;
      if (presencas[mid] && presencas[mid].status === 'confirmado') contagem[mid].confirmacoes++;
    });
  });
  return contagem;
}

function estatisticasDeContagem(membros, contagem) {
  return membros.map(m => {
    const c = contagem[m.id] || { convites: 0, confirmacoes: 0 };
    return {
      id: m.id, nome: m.nome, grau: m.grau, divisao: m.divisao, funcoes: m.funcoes,
      convites: c.convites, confirmacoes: c.confirmacoes,
      percentual: c.convites ? Math.round((c.confirmacoes / c.convites) * 100) : null
    };
  });
}

// % de cada integrante calculado so a partir dos eventos ENCERRADOS de um
// tipo especifico. Convites conta so eventos daquele tipo em que o membro
// foi convidado (tem linha em Presencas); confirmacoes so as que tem status
// "confirmado". Roster/eventos respeitam o filtro de divisao do painel
// (membrosVisiveisRelatorio/eventosDoRelatorioEscopo).
function estatisticasMembrosPorTipo(tipo) {
  const eventosTipo = eventosDoRelatorioEscopo().filter(e => e.status === 'encerrado' && e.tipo === tipo);
  return estatisticasDeContagem(membrosVisiveisRelatorio(), contarConfirmacoesPorMembro(eventosTipo));
}

// % de cada integrante dentro de uma janela de tempo (1/3/6/12 meses) - usa
// o mesmo corte de data do card "Presença total" (dataCorteMeses,
// resumoDonutPeriodo), pra nao mostrar uma % "desde sempre" embaixo de
// donuts que ja tem um periodo escolhido. Calculado no navegador a partir de
// state.reportData (ja carregado pra aba Resumo Relatorio inteira), sem
// round-trip novo ao servidor.
function estatisticasMembrosPorPeriodo(meses) {
  const corte = dataCorteMeses(meses);
  const eventosNoPeriodo = eventosDoRelatorioEscopo().filter(e => e.status === 'encerrado' && e.data && e.data >= corte);
  return estatisticasDeContagem(membrosVisiveisRelatorio(), contarConfirmacoesPorMembro(eventosNoPeriodo));
}

// Historico evento a evento de um membro (mais recente primeiro) - base da
// "Ficha do membro" (renderFichaMembro), aberta ao tocar num nome em
// qualquer lista de "% de cada integrante". So eventos encerrados em que
// esse membro foi convidado (tem linha em Presencas), dentro do mesmo
// filtro de divisao do painel (eventosDoRelatorioEscopo).
function historicoMembro(membroId) {
  const eventosOrdemCronologica = eventosDoRelatorioEscopo()
    .filter(ev => ev.status === 'encerrado' && ev.memberIds.includes(membroId))
    .sort((a, b) => (a.data || '').localeCompare(b.data || '') || (a.criadoEm || '').localeCompare(b.criadoEm || ''));

  let convites = 0, confirmacoes = 0, justificadas = 0, infracionais = 0;
  const itens = eventosOrdemCronologica.map(ev => {
    const presencas = state.reportData[ev.id];
    const statusBruto = presencas && presencas[membroId] ? presencas[membroId].status : null;
    // Evento encerrado sem resposta vira falta infracional (ver statusEfetivo) -
    // aplicado aqui tambem, senao a ficha mostraria "Aguardando" pra eventos
    // ja fechados de antes dessa regra existir.
    const status = presencas ? statusEfetivo(ev, statusBruto || 'aguardando') : null;
    if (presencas) {
      convites++;
      if (status === 'confirmado') confirmacoes++;
      else if (status === 'familia' || status === 'trabalho' || status === 'justificada') justificadas++;
      else if (status === 'infracional') infracionais++;
    }
    return {
      ev, status,
      // % acumulada ate esse evento (inclusive), na ordem cronologica - da
      // o "sparkline" pessoal (como a media do membro foi evoluindo ao
      // longo do tempo), reaproveitando renderSparklineTendencia que ja
      // existe pro Rank Total. Fica null enquanto o evento ainda nao
      // carregou (ver faltaCarregar em renderFichaMembro).
      pctAcumulado: presencas ? Math.round((confirmacoes / convites) * 100) : null
    };
  });
  return { itens: itens.slice().reverse(), convites, confirmacoes, justificadas, infracionais };
}

function renderFichaMembro(membroId) {
  const m = state.roster.find(x => x.id === membroId);
  if (!m) return '<div class="empty">Membro não encontrado.</div>';

  const { itens, convites, confirmacoes, justificadas, infracionais } = historicoMembro(membroId);
  const percentual = convites ? Math.round((confirmacoes / convites) * 100) : null;
  // renderSparklineTendencia espera ordem cronologica (mais antigo primeiro) -
  // itens ja vem invertido (mais recente primeiro) pra lista embaixo, entao
  // desfaz so pra montar a linha.
  const itensSparkline = itens.slice().reverse()
    .filter(it => it.pctAcumulado !== null)
    .map(it => ({ ev: it.ev, pct: it.pctAcumulado }));

  return `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-family:'Rye',serif; font-size:19px; color:var(--white-strong);">${escapeHtml(m.nome)}${m.grau ? ` <span class="grade-box">${escapeHtml(m.grau)}</span>` : ''}</div>
      <div style="color:var(--text-muted); font-size:12.5px; margin-top:4px;">${escapeHtml(m.divisao || '—')}</div>
      ${linhaFuncoes(m.funcoes)}
      ${renderDonutChart(segmentosDonutStatus({ confirmado: confirmacoes, justificada: justificadas, infracional: infracionais }), percentual === null ? '—' : percentual + '%', 'presença', 130)}
      <div class="info-line" style="padding:8px 0 0; color:var(--text-muted); font-size:12px;">${convites} ${convites === 1 ? 'evento' : 'eventos'} no histórico</div>
      ${itensSparkline.length > 1 ? renderSparklineTendencia(itensSparkline) : ''}
    </div>
    <div class="card">
      <div style="font-weight:600; margin-bottom:6px;">Histórico evento a evento</div>
      ${!itens.length ? '<div class="empty">Nenhum evento encerrado ainda.</div>' : itens.map(it => {
        const s = STATUS[it.status] || STATUS.aguardando;
        return `
          <div class="member-row">
            <div class="member-head">
              <div class="member-info-wrap">
                <span class="member-name">${escapeHtml(it.ev.nome)}</span>
                <div style="color:var(--text-muted); font-size:11.5px;">${it.ev.data ? formatDataBR(it.ev.data) : '—'}</div>
              </div>
              <span class="status-badge status-${it.status || 'aguardando'}">${s.emoji} ${s.label}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// Agrupa uma lista de estatisticas de membro (precisa de nome/divisao/
// percentual) por divisao - Regional primeiro, resto em ordem alfabetica
// (mesmo criterio de agruparPorDivisao), mantendo dentro de cada grupo a
// ordenacao por % (maior primeiro), que e o que da sentido a lista.
function agruparStatsPorDivisao(lista) {
  const porDivisao = {};
  lista.forEach(item => {
    const chave = item.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(item);
  });
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return ordenadas.map(divisao => ({
    divisao,
    itens: [...porDivisao[divisao]].sort((a, b) => {
      if (a.percentual === null && b.percentual === null) return a.nome.localeCompare(b.nome);
      if (a.percentual === null) return 1;
      if (b.percentual === null) return -1;
      return b.percentual - a.percentual || a.nome.localeCompare(b.nome);
    })
  }));
}

// Uma linha de "% de cada integrante" - nome + grau (herdado do cadastro,
// mesmo selo usado no resto do app) + selos de funcao, pra nao ficar so uma

// "% de cada integrante" agrupada por divisao, com cabecalho recolhivel

// Uma das 4 abas fixas "Relatorio Pub/Bate e Volta/Reuniao/Acao Social":
// so a tabela de % por evento daquele tipo (sem grafico, sem chips de
// periodo - todo o historico) + a % de cada integrante so naquele tipo.
function conteudoRelatorioTipoFixo(tipo) {
  const eventosTipo = eventosDoRelatorioEscopo()
    .filter(e => e.status === 'encerrado' && e.tipo === tipo)
    .sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const faltaCarregar = eventosTipo.some(e => !(e.id in state.reportData));

  const linhas = eventosTipo.map(ev => {
    const c = state.reportData[ev.id] ? computeCounts(ev) : null;
    const total = ev.memberIds.length;
    return { ev, confirmado: c ? c.confirmado : null, total, pct: c && total ? Math.round((c.confirmado / total) * 100) : null };
  });

  const membros = estatisticasMembrosPorTipo(tipo);

  return `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:8px;">${emojiTipoEvento(tipo)} Relatório ${escapeHtml(tipo)}</div>
      ${!eventosTipo.length ? `<div class="empty">Nenhum evento encerrado do tipo "${escapeHtml(tipo)}" ainda.</div>` : faltaCarregar ? '<div class="empty">Carregando…</div>' : `
        <div style="overflow-x:auto;">
          <table class="relatorio-tabela">
            <thead><tr><th>Evento</th><th>Data</th><th style="text-align:right;">Confirmados</th><th style="text-align:right;">%</th></tr></thead>
            <tbody>
              ${linhas.map(({ ev, confirmado, total, pct }) => `
                <tr>
                  <td>${escapeHtml(ev.nome)}</td>
                  <td>${ev.data ? formatDataBR(ev.data) : '—'}</td>
                  <td class="num">${confirmado === null ? '…' : confirmado + '/' + total}</td>
                  <td class="num">${pct === null ? '…' : pct + '%'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>

    <div class="card">
      <div style="font-weight:600; margin-bottom:6px;">% de cada integrante em ${escapeHtml(tipo)}</div>
      ${faltaCarregar ? '<div class="empty">Carregando…</div>' : !membros.length ? '<div class="empty">Nenhum membro cadastrado ainda.</div>' : renderListaEstatisticasPorDivisao(membros)}
    </div>
  `;
}

// Pagina principal da tela "Relatorios" depois do PIN: painel com 5 donuts
// (Presenca total, em destaque no topo, + um por TIPOS_EVENTO alinhados
// embaixo), cada um com seu proprio periodo (1/3/6/12 meses) e contagem de
// eventos. Clicar em "Ver eventos" de um card abre o grafico+tabela so
// daquele grupo (conteudoRelatorioTipoDetalhe).
function conteudoRelatorioPresenca() {
  const encerrados = eventosDoRelatorioEscopo().filter(e => e.status === 'encerrado');

  // % de cada integrante no mesmo periodo do card "Presença total" (em vez
  // de sempre "desde sempre") - antes essa lista vinha de uma acao propria
  // no Code.gs (lerEstatisticasMembros) que ignorava o periodo escolhido
  // nos donuts acima; agora usa o mesmo state.reportData ja carregado pra
  // aba inteira, sem round-trip novo ao servidor.
  const mesesLista = state.relatorioPeriodoPorGrafico.total || 3;
  const corteLista = dataCorteMeses(mesesLista);
  const faltaCarregarLista = encerrados.some(e => e.data && e.data >= corteLista && !(e.id in state.reportData));
  const listaMembros = faltaCarregarLista ? null : estatisticasMembrosPorPeriodo(mesesLista);

  const corpoPrincipal = state.relatorioTipoDetalhe
    ? conteudoRelatorioTipoDetalhe(encerrados, state.relatorioTipoDetalhe)
    : `
      ${renderDonutCard('Presença total', 'total', encerrados, true)}
      <div class="donut-grid">
        ${TIPOS_EVENTO.map(tipo => renderDonutCard(tipo, tipo, encerrados, false)).join('')}
      </div>
      ${renderRankingFaltasInfracionais(encerrados)}
    `;

  return `
    <div class="print-only" style="margin-bottom:10px; font-size:12px; color:var(--text-muted);">Gerado em ${escapeHtml(new Date().toLocaleString('pt-BR'))}</div>
    <button class="btn secondary block no-print" style="margin-bottom:14px;" data-action="imprimir-relatorio">🖨️ Imprimir / Exportar PDF</button>

    ${corpoPrincipal}

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:6px;">% de cada integrante <span style="color:var(--text-muted); font-weight:400; font-size:12px;">(últimos ${mesesLista === 1 ? 'mês' : mesesLista + ' meses'})</span></div>
      ${!listaMembros ? '<div class="empty">Carregando…</div>' : !listaMembros.length ? '<div class="empty">Nenhum membro cadastrado ainda.</div>' : renderListaEstatisticasPorDivisao(listaMembros)}
    </div>
  `;
}

// Google Sheets recusa lote grande demais de leituras ao mesmo tempo ("Muitos
// pedidos simultaneos"). Antes disso so acontecia com dezenas de eventos
// (ex.: depois de gerarDadosFakeTeste); disparando tudo de uma vez com
// Promise.allSettled, como fazia antes, o navegador manda uma leitura por
// evento em paralelo sem limite nenhum. Aqui o mesmo trabalho e feito em
// lotes pequenos, um atras do outro - mais lento, mas nao esbarra no limite.
async function emLotes(itens, tamanhoDoLote, tarefa) {
  const resultados = [];
  for (let i = 0; i < itens.length; i += tamanhoDoLote) {
    const lote = itens.slice(i, i + tamanhoDoLote);
    const parciais = await Promise.allSettled(lote.map(tarefa));
    resultados.push(...parciais);
  }
  return resultados;
}

async function loadReportData() {
  const encerrados = state.events.filter(e => e.status === 'encerrado');
  const missing = encerrados.filter(e => !(e.id in state.reportData));
  state.reportError = null;
  if (missing.length) {
    const results = await emLotes(missing, 5, e => api('presencas', { eventoId: e.id }));
    missing.forEach((e, i) => {
      // Um evento sem dado fica de fora de propósito: melhor mostrar traço do
      // que um relatorio dizendo que ninguem confirmou.
      if (results[i].status === 'fulfilled') state.reportData[e.id] = results[i].value.presencas || {};
      else state.reportError = results[i].reason.message;
    });
  }
  render();
}

// Sempre recarrega ao entrar na aba: e um numero que muda a cada evento
// encerrado, diferente do relatorio por evento que so busca o que falta.
async function loadEstatisticas() {
  state.estatisticasLoading = true;
  state.estatisticasError = null;
  render();
  try {
    const r = await api('estatisticas', { categoria: state.adminEscopo });
    state.estatisticas = r.membros || [];
  } catch (e) {
    state.estatisticasError = e.message;
  }
  state.estatisticasLoading = false;
  render();
}

// Carrega as estatisticas (% de cada um + medias por divisao) e o historico
// curto de rodadas juntos. As marcacoes comecam tudo zerado (ninguem fez) -
// o administrador so marca quem fez, que costuma ser menos toque que marcar
// todo mundo e desmarcar quem faltou.
async function loadInsightStats() {
  state.insightStatsLoading = true;
  state.insightStatsError = null;
  render();
  try {
    const [stats, hist] = await Promise.all([
      api('insightEstatisticas'),
      api('insightRodadas'),
    ]);
    state.insightStats = stats;
    state.insightRodadasHistorico = hist.rodadas || [];
    state.insightMarcacoes = {};
    stats.membros.forEach(m => { state.insightMarcacoes[m.id] = false; });
  } catch (e) {
    state.insightStatsError = e.message;
  }
  state.insightStatsLoading = false;
  render();
}

function renderAdminPresencas() {
  if (state.estatisticasError) {
    return `
      <div class="alert">
        <div class="alert-title">Não consegui carregar</div>
        <div class="alert-msg">${escapeHtml(state.estatisticasError)}.</div>
        <button class="btn secondary block" data-action="retry-estatisticas" style="margin-top:10px;">Tentar de novo</button>
      </div>
    `;
  }
  if (state.estatisticasLoading || !state.estatisticas) {
    return '<div class="alert info"><div class="alert-msg">Calculando presença de cada membro…</div></div>';
  }
  if (!state.estatisticas.length) {
    return '<div class="empty">Nenhum membro cadastrado ainda.</div>';
  }

  // Quem nunca teve evento encerrado (percentual null) fica no fim, sem
  // competir com quem ja tem historico de verdade.
  const lista = [...state.estatisticas].sort((a, b) => {
    if (a.percentual === null && b.percentual === null) return a.nome.localeCompare(b.nome);
    if (a.percentual === null) return 1;
    if (b.percentual === null) return -1;
    return b.percentual - a.percentual || a.nome.localeCompare(b.nome);
  });

  return `
    <div class="alert info" style="margin-bottom:16px;">
      <div class="alert-msg">Percentual de presença nos eventos já encerrados de ${escapeHtml(escopoPorChave(state.adminEscopo).nome)}. Quem entrou depois de um evento não é contado nele.</div>
    </div>
    ${lista.map(m => {
      if (m.percentual === null) {
        return `
          <div class="card presenca-row">
            <div class="presenca-nome">${escapeHtml(m.nome)}</div>
            <div class="presenca-sem-dados">Sem eventos encerrados ainda</div>
          </div>
        `;
      }
      return `
        <div class="card presenca-row">
          <div class="presenca-info">
            <div class="presenca-nome">${escapeHtml(m.nome)}</div>
            <div class="presenca-contagem">${m.confirmacoes} de ${m.convites} eventos</div>
          </div>
          <div class="presenca-pct-wrap">
            <div class="presenca-barra"><div class="presenca-barra-fill" style="width:${m.percentual}%"></div></div>
            <div class="presenca-pct">${m.percentual}%</div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// Nao responder a convocacao e falta igual a uma falta sem justificativa
// (decisao do clube) - so faz sentido continuar "Aguardando" enquanto o
// evento ainda esta aberto (a pessoa ainda pode responder). O Code.gs ja
// converte isso na planilha ao encerrar (converterAguardandoParaInfracionalAoEncerrar),
// mas essa funcao e chamada aqui tambem, na leitura, como rede de seguranca
// pra eventos que ja estavam encerrados antes dessa regra existir - sem
// isso eles ficariam eternamente mostrando "Aguardando" ate alguem rodar a
// migracao manual na planilha (migrarAguardandoDeEventosJaEncerrados).
function statusEfetivo(ev, statusBruto) {
  return (ev.status === 'encerrado' && statusBruto === 'aguardando') ? 'infracional' : statusBruto;
}

function computeCounts(ev) {
  const statusData = state.reportData[ev.id] || {};
  const counts = { confirmado: 0, familia: 0, trabalho: 0, aguardando: 0, justificada: 0, infracional: 0 };
  ev.memberIds.forEach(mid => {
    const s = statusEfetivo(ev, (statusData[mid] && statusData[mid].status) || 'aguardando');
    if (counts[s] !== undefined) counts[s]++; else counts.aguardando++;
  });
  return counts;
}

function getReportGroups(ev) {
  const statusData = state.reportData[ev.id] || {};
  const groups = { confirmado: [], familia: [], trabalho: [], aguardando: [], justificada: [], infracional: [] };
  ev.memberIds.forEach(mid => {
    const m = state.roster.find(r => r.id === mid);
    if (!m) return;
    const s = statusEfetivo(ev, (statusData[mid] && statusData[mid].status) || 'aguardando');
    (groups[s] || groups.aguardando).push(m.nome);
  });
  return groups;
}

function buildReportText(ev) {
  const groups = getReportGroups(ev);
  // Familia, trabalho e justificada sao razoes de falta justificada; juntas
  // viram uma unica secao "nao puderam ir", com o motivo ao lado de cada nome.
  const naoPuderamIr = [
    ...groups.familia.map(n => ({ nome: n, motivo: 'Família' })),
    ...groups.trabalho.map(n => ({ nome: n, motivo: 'Trabalho' })),
    ...groups.justificada.map(n => ({ nome: n, motivo: 'Justificada' })),
  ];

  const total = ev.memberIds.length;
  const percentual = total ? Math.round((groups.confirmado.length / total) * 100) : 0;

  const lines = [];
  lines.push('📋 RELATÓRIO DE PRESENÇA');
  lines.push(ev.nome);
  if (ev.data) lines.push('🗓️ ' + formatDataBR(ev.data));
  if (ev.endereco) lines.push('📍 ' + ev.endereco);
  lines.push('');
  lines.push(`📊 ${percentual}% DE PRESENÇA (${groups.confirmado.length} de ${total})`);
  lines.push('');
  lines.push(`✅ CONFIRMARAM (${groups.confirmado.length})`);
  lines.push(...(groups.confirmado.length ? groups.confirmado.map(n => '- ' + n) : ['- Ninguém confirmou']));
  lines.push('');
  lines.push(`❌ NÃO PUDERAM IR (${naoPuderamIr.length})`);
  lines.push(...(naoPuderamIr.length ? naoPuderamIr.map(m => `- ${m.nome} (${m.motivo})`) : ['- Ninguém avisou falta']));
  lines.push('');
  // Sem secao de "Nao responderam": evento encerrado nao tem mais esse
  // status (ver statusEfetivo) - quem nao respondeu ja caiu em Infracional.
  lines.push(`⭕ FALTA INFRACIONAL (${groups.infracional.length})`);
  lines.push(...(groups.infracional.length ? groups.infracional.map(n => '- ' + n) : ['- Nenhuma']));
  return lines.join('\n');
}

// Extraido de copyReportToClipboard pra reaproveitar tambem no "Copiar
// relatorio" de cada rodada de Insight (copyInsightReportToClipboard) -
// navigator.clipboard exige contexto seguro (https) e falha silenciosa em
// alguns navegadores/paginas embutidas, daí o fallback com textarea+
// execCommand, que funciona bem mais amplamente.
async function copiarTexto(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

async function copyReportToClipboard(ev) {
  const ok = await copiarTexto(buildReportText(ev));
  if (ok) {
    state.copiedEventId = ev.id;
    render();
    setTimeout(() => {
      if (state.copiedEventId === ev.id) {
        state.copiedEventId = null;
        render();
      }
    }, 1600);
  }
}

// Mesma ideia de buildReportText, so que pra uma rodada de Insight (Sim/Nao
// por membro, sem motivo de falta - Insight nao tem isso). r.membros vem de
// listarInsightRodadas no Code.gs.
// Agrupa uma lista de membros (com nome/divisao ja resolvidos) por divisao
// em ordem alfabetica, um cabecalho por divisao + os nomes ordenados dentro
// - mesmo padrao visual dos outros relatorios do app.
function agruparNomesPorDivisaoParaTexto(lista) {
  const porDivisao = {};
  lista.forEach(m => {
    const chave = m.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(m);
  });
  const linhas = [];
  Object.keys(porDivisao).sort((a, b) => a.localeCompare(b)).forEach(divisao => {
    linhas.push(divisao.toUpperCase() + ':');
    porDivisao[divisao]
      .slice()
      .sort((a, b) => a.nome.localeCompare(b.nome))
      .forEach(m => linhas.push('- ' + m.nome + (m.grau ? ` (${m.grau})` : '')));
  });
  return linhas;
}

function buildInsightReportText(r) {
  // r.membros so traz id/nome/divisao "fotografados" na hora da rodada (ver
  // listarInsightRodadas no Code.gs) - o grau nao fica gravado la, entao
  // busca no cadastro atual (state.roster) pelo id. Se o membro foi excluido
  // depois, fica sem grau (grau vazio), mas o nome continua aparecendo.
  const comGrau = (r.membros || []).map(m => {
    const cadastro = state.roster.find(x => x.id === m.id);
    return { nome: m.nome, divisao: m.divisao, fez: m.fez, grau: cadastro ? cadastro.grau : '' };
  });
  const fizeram = comGrau.filter(m => m.fez);
  const naoFizeram = comGrau.filter(m => !m.fez);
  const lines = [];
  lines.push('💡 RELATÓRIO DE INSIGHT');
  if (r.data) lines.push('🗓️ ' + formatDataBR(r.data));
  lines.push('');
  lines.push(`📊 ${r.percentual === null ? '—' : r.percentual + '%'} FIZERAM (${r.totalSim} de ${r.totalElegiveis})`);
  lines.push('');
  lines.push(`✅ FIZERAM (${fizeram.length})`);
  lines.push(...(fizeram.length ? agruparNomesPorDivisaoParaTexto(fizeram) : ['- Ninguém fez']));
  lines.push('');
  lines.push(`❌ NÃO FIZERAM (${naoFizeram.length})`);
  lines.push(...(naoFizeram.length ? agruparNomesPorDivisaoParaTexto(naoFizeram) : ['- Todos fizeram']));
  return lines.join('\n');
}

async function copyInsightReportToClipboard(r) {
  const ok = await copiarTexto(buildInsightReportText(r));
  if (ok) {
    state.copiedInsightRodadaId = r.id;
    render();
    setTimeout(() => {
      if (state.copiedInsightRodadaId === r.id) {
        state.copiedInsightRodadaId = null;
        render();
      }
    }, 1600);
  }
}

function renderAdminRelatorio() {
  const encerrados = eventosDoEscopo().filter(e => e.status === 'encerrado');
  if (encerrados.length === 0) {
    return '<div class="empty">Nenhum evento encerrado ainda.<br>Os relatórios aparecem aqui depois que você encerrar um evento.</div>';
  }
  const aviso = state.reportError ? `
    <div class="alert">
      <div class="alert-title">Alguns relatórios não carregaram</div>
      <div class="alert-msg">${escapeHtml(state.reportError)}.<br>Os eventos marcados com — estão incompletos, não copie esses.</div>
      <button class="btn secondary block" data-action="retry-report" style="margin-top:10px;">Tentar de novo</button>
    </div>
  ` : '';

  return aviso + encerrados.map(ev => {
    const carregado = ev.id in state.reportData;
    const counts = computeCounts(ev);
    const total = ev.memberIds.length;
    const isOpen = state.expandedReportEventId === ev.id;
    const n = (v) => carregado ? v : '—';
    const percentual = carregado && total ? Math.round((counts.confirmado / total) * 100) : null;
    return `
      <div class="card">
        <div class="member-head" ${carregado ? `data-action="toggle-report-event" data-id="${ev.id}"` : ''}>
          <div>
            <div style="font-family:'Rye',serif; font-size:17px; color:var(--white-strong);">${escapeHtml(ev.nome)}</div>
            <div style="color:var(--text-muted); font-size:12px; margin-top:5px;">${total} membros aptos${percentual !== null ? ` · <b style="color:var(--white-strong);">${percentual}% de presença</b>` : ''}</div>
          </div>
          <span style="color:var(--text-muted); font-size:19px;">${carregado ? (isOpen ? '−' : '+') : ''}</span>
        </div>
        <div class="count-grid">
          <div class="count-box-report">✅ Confirmados <b>${n(counts.confirmado)}</b></div>
          <div class="count-box-report">❌ Falta justificada <b>${n(counts.familia + counts.trabalho + counts.justificada)}</b></div>
          <div class="count-box-report">⭕ Falta infracional <b>${n(counts.infracional)}</b></div>
        </div>
        ${carregado ? `<button class="btn secondary block" data-action="copy-report" data-id="${ev.id}" style="margin-top:10px;">${state.copiedEventId === ev.id ? 'Copiado ✓' : '📋 Copiar relatório'}</button>` : ''}
        ${isOpen && carregado ? renderReportDetail(ev) : ''}
        ${renderExcluirEvento(ev)}
      </div>
    `;
  }).join('');
}

// Excluir so aparece aqui, na aba Relatorio, onde so entram eventos ja

function renderReportDetail(ev) {
  const groups = getReportGroups(ev);
  const counts = computeCounts(ev);
  const section = (label, emoji, list) => list.length ? `
    <div style="margin-top:10px;">
      <div style="font-size:11px; color:var(--text-muted); letter-spacing:0.03em; margin-bottom:4px;">${emoji} ${label.toUpperCase()}</div>
      <div style="font-size:13.5px; color:var(--text); line-height:1.6;">${list.map(escapeHtml).join(', ')}</div>
    </div>
  ` : '';
  // Familia, trabalho e justificada sao razoes de falta justificada - juntas
  // numa unica secao, com o motivo ao lado do nome (mesmo agrupamento de
  // buildReportText, pro texto copiado bater com o que aparece aqui). Sem
  // secao de "Nao responderam": evento encerrado nao tem mais esse status
  // (ver statusEfetivo) - quem nao respondeu ja caiu em Infracional.
  const faltaJustificada = [
    ...groups.familia.map(n => `${n} (Família)`),
    ...groups.trabalho.map(n => `${n} (Trabalho)`),
    ...groups.justificada.map(n => `${n} (Justificada)`),
  ];
  // Donut so aqui no detalhe expandido (nao no card recolhido) - senao toda
  // a lista de eventos encerrados ficaria mais alta a toa, so pra mostrar um
  // grafico que a maioria vai abrir so de vez em quando.
  const donut = renderDonutChart(segmentosDonutStatus({
    confirmado: counts.confirmado,
    justificada: counts.familia + counts.trabalho + counts.justificada,
    infracional: counts.infracional
  }), ev.memberIds.length ? Math.round((counts.confirmado / ev.memberIds.length) * 100) + '%' : '—', 'presença', 130);
  return `
    <div style="border-top:1px solid var(--line); margin-top:12px; padding-top:12px;">
      ${donut}
      ${section('Confirmados', '✅', groups.confirmado)}
      ${section('Falta - Justificada', '❌', faltaJustificada)}
      ${section('Falta - Infracional', '⭕', groups.infracional)}
    </div>
  `;
}

    <div class="event-header">
      <h1 style="font-size: 20px;">Organizador</h1>

      <div class="tab ${state.adminTab === 'membros' ? 'active' : ''}" data-action="admin-tab" data-tab="membros">Membros</div>

function eventosDoEscopo() {
  return state.events.filter(ev => (ev.categoria || 'barra') === state.adminEscopo);
}

function renderAdminEventos() {
  if (state.newEventSelected !== null) {
    return renderEventForm();
  }
  const rel = state.relatorioState;
  const eventos = eventosDoEscopo();
  // A planilha inteira (aba Relatorio) cobre todas as divisoes juntas, entao
  // so faz sentido regenerar ela de dentro do Regional - quem enxerga o
  // quadro geral. Cada divisao usa o "Copiar relatorio" (por evento, na aba
  // Relatorio do organizador), que continua disponivel pra todo mundo.
  const podeGerarPlanilha = state.adminEscopo === 'regional';
  return `
    <button class="btn block" data-action="start-new-event" style="margin-bottom: 10px;">+ Criar evento</button>
    ${podeGerarPlanilha ? `
      <button class="btn secondary block on-photo" data-action="gerar-relatorio" style="margin-bottom: 6px;" ${rel === 'gerando' ? 'disabled' : ''}>
        ${rel === 'gerando' ? 'Gerando na planilha…' : '📊 Gerar relatório na planilha'}
      </button>
      ${rel === 'ok' ? '<div class="alert ok" style="margin-bottom:16px;"><div class="alert-msg">✅ Relatório atualizado na aba <b>Relatorio</b> da planilha.</div></div>' : ''}
      ${rel === 'erro' ? `<div class="alert" style="margin-bottom:16px;"><div class="alert-title">Não consegui gerar</div><div class="alert-msg">${escapeHtml(state.relatorioErro || '')}.</div></div>` : ''}
      ${rel !== 'ok' && rel !== 'erro' ? '<div style="margin-bottom:16px;"></div>' : ''}
    ` : '<div style="margin-bottom:16px;"></div>'}
    ${eventos.length === 0 ? '<div class="empty">Nenhum evento criado ainda.</div>' : eventos.map(ev => {
      const memberCount = ev.memberIds.length;
      // Mesma arte/cor por tipo dos cards de evento dos Relatorios - aqui e
      // so background inline (sem as classes tipo-*) porque esse card e so
      // ".card" (empilha titulo + botoes por baixo), nao ".event-card"
      // (linha unica com flex/space-between), entao as regras CSS
      // acopladas a .event-card.tipo-* nao serviriam pra esse layout.
      const cor = corTipoEvento(ev.tipo);
      const imagemFundo = TIPO_HOME_IMAGEM[ev.tipo];
      const estiloFundo = !ev.tipo ? '' : imagemFundo
        ? `background-image:url('${imagemFundo}'); background-size:cover; background-position:center; border-left:3px solid ${cor};`
        : `background:${hexParaRgba(cor, 0.14)}; border-left:3px solid ${cor};`;
      return `
        <div class="card" style="${estiloFundo}">
          <div style="display:flex; align-items:center; gap:14px;">
            ${ev.tipo ? `<div class="tipo-home-icone" style="border-color:${cor}; flex-shrink:0;">${emojiTipoEvento(ev.tipo)}</div>` : ''}
            <div style="min-width:0;">
              <div style="font-family:'Rye',serif; font-size:17px; color: var(--white-strong);">${escapeHtml(ev.nome)}</div>
              <div style="color:var(--text-muted); font-size:12px; margin-top:5px;">${memberCount} membros · ${ev.status === 'encerrado' ? 'Encerrado' : 'Ativo'}</div>
            </div>
          </div>
          <div class="row-gap" style="margin-top:12px;">
            <button class="btn secondary" data-action="start-edit-event" data-id="${ev.id}">Editar</button>
            <button class="btn secondary" data-action="toggle-event-status" data-id="${ev.id}">${ev.status === 'encerrado' ? 'Reabrir' : 'Encerrar'}</button>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// Evento regional convida gente de todas as divisoes (Regional incluso);
// evento de uma divisao especifica so pode convidar os proprios membros.

      </div>

        ${elegiveis.length > 0 ? `
          <div>

// So os membros da divisao (ou Regional) que o organizador esta gerenciando
// agora - mesma logica de eventosDoEscopo(), pro organizador de uma divisao
// nao ver nem poder mexer nos membros de outra.
function membrosDoEscopo() {
