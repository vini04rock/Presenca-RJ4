  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 16px 60px;
    position: relative;
    z-index: 1;
  }
  h1, h2, h3, .display {
    font-family: 'Rye', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .crest-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }
  .crest-wrap img {
    width: 168px;
    height: 168px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .crest-wrap h1 { font-size: 21px; color: var(--white-strong); line-height: 1.3; }
  .crest-wrap .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0.04em; }
  .ring-divider {
    height: 5px;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
    margin: 20px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .event-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .event-card:active { background: var(--surface-alt); }
  .event-card .name { font-size: 18px; font-family: 'Rye', serif; font-weight: 400; color: var(--white-strong); padding-right: 56px; }
  .event-card .meta { font-size: 12px; color: var(--text-muted); margin-top: 5px; font-family: 'IBM Plex Sans', sans-serif; }
  .event-card .arrow { color: var(--text-muted); font-size: 20px; font-family: 'IBM Plex Sans', sans-serif; }
  /* "Personalidade" por tipo de evento (aba Eventos dos Relatorios, ver
     TIPO_EVENTO_CLASSE/corTipoEvento no script) - tons transparentes por
     cima do fundo escuro do card, nao cor solida gritante. Cada tipo tem o
     proprio :active (mais escuro que o normal), senao o toque no celular
     ficaria sem feedback nesses cards. */
  .event-card.tipo-pub { background: rgba(224, 178, 60, 0.14); border-left: 3px solid #E0B23C; }
  .event-card.tipo-pub:active { background: rgba(224, 178, 60, 0.24); }
  .event-card.tipo-bate-e-volta { background: rgba(217, 87, 60, 0.14); border-left: 3px solid #D9573C; }
  .event-card.tipo-bate-e-volta:active { background: rgba(217, 87, 60, 0.24); }
  .event-card.tipo-acao-social { background: rgba(76, 175, 110, 0.14); border-left: 3px solid #4CAF6E; }
  .event-card.tipo-acao-social:active { background: rgba(76, 175, 110, 0.24); }
  .event-card.tipo-reuniao { background: rgba(76, 134, 217, 0.14); border-left: 3px solid #4C86D9; }
  .event-card.tipo-reuniao:active { background: rgba(76, 134, 217, 0.24); }
  /* Tela "Escolha o tipo de evento" (renderHomeTipos) - icone grande em
     anel colorido + frase de efeito por tipo. Cards com imagem de fundo
     usam filter:brightness no toque em vez de trocar o background (que so
     funciona pra cor solida) - assim o feedback de toque funciona igual
     tenha imagem ou nao. */
  .tipo-home-card { min-height: 84px; }
  .tipo-home-card:active { filter: brightness(0.82); }
  .tipo-home-icone {
    width: 50px; height: 50px; border-radius: 50%; border: 2px solid;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .tipo-home-tagline {
    display: flex; align-items: center; gap: 7px;
    font-size: 10px; letter-spacing: 0.08em; font-weight: 700;
    margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tipo-home-linha { width: 16px; height: 2px; flex-shrink: 0; display: inline-block; }
  /* Card "Eventos" da tela inicial - a arte ja traz o texto desenhado, entao
     o card fica bem mais baixo/largo que os outros (so a seta em cima). */
  .card-eventos-home {
    min-height: 82px;
    background-size: cover;
    background-position: center;
    border-left: 3px solid #D4A24C;
  }
  .card-eventos-home:active { filter: brightness(0.82); }
  /* Cards "Modo organizador"/"Relatórios" da tela inicial - lado a lado,
     mesma receita do card-rank-home (aspect-ratio em vez de altura fixa),
     so que 20% mais baixos (5.15/0.8 = 6.44) - por pedido, pra ficarem
     nitidamente menores que o card Eventos, mais discretos por serem
     acesso de organizador/relatorio, nao o fluxo principal. Antes eram so
     um botao-texto no rodape (Modo organizador) + o botao "Relatórios". */
  .card-admin-home {
    flex: 1 1 0;
    min-width: 130px;
    padding: 6px 10px;
    aspect-ratio: 6.44 / 1;
    background-size: cover;
    background-position: center;
    margin-bottom: 0;
  }
  .card-admin-home:active { filter: brightness(0.82); }
  .card-admin-home .arrow { font-size: 16px; }
  .card-organizador-home { border-left: 3px solid #D4A24C; }
  .card-relatorios-home { border-left: 3px solid #4C86D9; }
  /* Rank de Presença/Insights - lado a lado, menores que o card Eventos
     (que fica sozinho, largura cheia, logo abaixo). flex:1 1 0 divide a
     largura igual entre os dois; min-width evita ficar espremido demais
     antes de quebrar linha (.row-gap ja tem flex-wrap) em tela bem estreita. */
  .card-rank-home {
    flex: 1 1 0;
    min-width: 130px;
    /* Altura calculada a partir da largura pra bater com a proporcao real
       da imagem (~5.15:1) - em vez de fixar uma altura e deixar a imagem se
       virar (cover cortava, contain sobrava fundo vazio), o card e que se
       ajusta a imagem, ai cover preenche sem cortar nem sobrar nada. So
       funciona de verdade se o padding do card nao empurrar a altura minima
       pra cima da altura que a proporcao pede - por isso o padding aqui e
       bem menor que o padrao de 16px do .card (que sozinho, com a largura
       estreita de um card lado a lado, ja forcava mais altura do que a
       proporcao da imagem permitia, e o cover cortava as laterais pra
       compensar). */
    padding: 6px 10px;
    aspect-ratio: 5.15 / 1;
    background-size: cover;
    background-position: center;
    margin-bottom: 0;
  }

  .card-rank-home .arrow { font-size: 16px; }
  .card-rank-presenca-home { border-left: 3px solid #D4A24C; }
  .card-rank-insights-home { border-left: 3px solid #4C86D9; }

    background-position: center;
  }
  .card-regional-home:active { filter: brightness(0.82); }
  .card-divisao-home {
    min-height: 82px;
    background-size: cover;
    background-position: center;
  }
  .card-divisao-home:active { filter: brightness(0.82); }

  .status-nao-fez { color: var(--status-infracional); border: 1px dashed var(--status-infracional); background: transparent; }
  .status-confirmado { color: #0A0A0A; background: var(--white-strong); border: 1px solid var(--white-strong); font-weight: 700; }

  .chart-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }

  /* Donut de status (aba Presenca > % total do periodo). Paleta pequena e

  :root {

    --status-aguardando: #9C9890;

  .donut-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

  /* Revisao da convocacao colada - cards empilhados em vez de tabela, pra
     nao depender de scroll horizontal em celular (a tabela antiga tinha 4
     colunas e um <select> dentro, ruim de usar com o dedo). */
  .revisao-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .revisao-row:first-child { border-top: none; }
  .revisao-row.ignorado { opacity: .5; }
  .revisao-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .revisao-nome { font-size: 14px; color: var(--white-strong); }
  .revisao-status { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
  .revisao-row-bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .revisao-row-bottom select { flex: 1 1 180px; min-width: 0; }
  .revisao-sugestoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .revisao-sugestoes .chip-option { padding: 4px 10px; font-size: 12px; }
  .texto-original-pre {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    margin: 8px 0 0;
    max-height: 260px;
    overflow-y: auto;
    cursor: text;
  }

  /* Impressao/PDF do Resumo Relatorio - .no-print esconde controles que so
     fazem sentido na tela (abas, chips de periodo, filtro, "Ver eventos");
     .print-only e o oposto, texto que so aparece no papel (qual periodo/
     filtro estava selecionado, ja que os chips somem). Redefinir as
     variaveis de cor em vez de sobrescrever cada seletor: o app inteiro ja
     e construido em cima delas, entao um :root novo dentro de @media print
     basta pra virar claro sem duplicar regra por regra. */
  .print-only { display: none; }
  @media print {
    .no-print { display: none !important; }
    .print-only { display: block; }
    /* Rank de Insights: as divisoes ficam recolhidas por padrao na tela (o
       usuario abre uma de cada vez), mas no PDF nao tem como clicar pra
       expandir - entao forca todo mundo aberto, senao o relatorio impresso
       sai so com "▸ NOME · N membros" e nenhum nome de verdade. */
    .insight-rank-membros { display: block !important; }
    body::before { display: none !important; }
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-alt: #f2f2f0;
      --line: #cccccc;
      --line-strong: #999999;
      --text: #111111;
      --text-muted: #555555;
      --white-strong: #000000;
      --danger-line: #b23c34;
    }
    body { background: #fff !important; }
    .card { box-shadow: none !important; }
    /* .status-confirmado usa --white-strong como FUNDO do selo (texto fixo
       #0A0A0A por cima) - na tela --white-strong e um creme claro, entao
       funciona; no papel ela vira preta (linha 653, pra servir de texto
       legivel em outros lugares) e o selo inteiro fica preto com texto
       quase preto em cima, ilegivel. Sobrescreve so aqui, de volta pra um
       fundo claro de verdade. */
    .status-confirmado { background: #ffffff !important; border-color: #0A0A0A !important; }

// CONFIGURACAO DA RJ4
// Cada item vira um botao proprio no Modo organizador, com o proprio PIN
// (guardado no Code.gs, nao aqui - ver verificarPin). A chave e o que fica
// gravado como categoria dos eventos e divisao dos membros criados dali.
// Para acrescentar uma divisao nova, e so um item a mais nesta lista, mais
// o PIN dela nas Propriedades do Script - nao precisa mexer em mais nada.
// ========================================================================
const CLUBE_NOME = 'Insanos MC';
const ESCOPOS = [
  { chave: 'barra', nome: 'Barra - RJ4' },
  { chave: 'oeste', nome: 'Oeste - RJ4' },
  { chave: 'recreio', nome: 'Recreio - RJ4' },
  { chave: 'curicica', nome: 'Curicica - RJ4' },
  { chave: 'taquara', nome: 'Taquara - RJ4' },
  { chave: 'gardenia', nome: 'Gardênia - RJ4' },
  { chave: 'regional', nome: 'Regional RJ4' },
];
function escopoPorChave(chave) { return ESCOPOS.find(e => e.chave === chave) || ESCOPOS[0]; }

// Ordem pra listar as divisoes nas telas (organizador, tela inicial, rank):
// Regional no topo, depois as demais em ordem alfabetica do nome. Separado
// da ordem de declaracao de ESCOPOS, que fica com Barra primeiro por ser o
// valor padrao seguro (escopoPorChave cai nela se receber uma chave invalida).
function escoposEmOrdemDeExibicao() {
  return [...ESCOPOS].sort((a, b) => {
    if (a.chave === 'regional') return -1;
    if (b.chave === 'regional') return 1;
    return a.nome.localeCompare(b.nome);
  });
}

// So as 6 divisoes, sem Regional - o Insight e coisa de quem esta na base,
// nao da diretoria regional (ver calcularEstatisticasInsights no Code.gs).
function divisoesSemRegional() {
  return escoposEmOrdemDeExibicao().filter(e => e.chave !== 'regional');
}

// So Regional e Barra na tela de Relatorios (decisao do clube) - Modo
// organizador e a tela inicial continuam com as 7 divisoes normalmente
// (escoposEmOrdemDeExibicao). Nada e apagado no backend/planilha, e so
// filtro de exibicao aqui.
function escoposAtivos() {
  return escoposEmOrdemDeExibicao().filter(e => e.chave === 'regional' || e.chave === 'barra');
}

const STATUS = {
  aguardando: { emoji: '⚠️', label: 'Aguardando' },
  confirmado: { emoji: '✅', label: 'Confirmado' },
  familia: { emoji: '❌', label: 'Família' },
  trabalho: { emoji: '❌', label: 'Trabalho' },
  // So aparecem em eventos criados pela tela "Relatorios" (colar convocacao) -
  // o picker manual continua limitado a STATUS_PICKER_KEYS, os 4 de cima.
  // "infracional" cobre tanto falta sem justificativa quanto quem nao
  // respondeu a convocacao (mesmo tratamento, decisao do clube).
  justificada: { emoji: '❌', label: 'Justificada' },
  infracional: { emoji: '⭕', label: 'Infracional' }
};
const STATUS_PICKER_KEYS = ['aguardando', 'confirmado', 'familia', 'trabalho'];
const GRAUS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

// Tipos de evento do clube. Escolha unica por evento. Para acrescentar um
// tipo novo, e so um item a mais em cada uma destas duas listas.
const TIPOS_EVENTO = ['Bate e Volta', 'Pub', 'Ação Social', 'Reunião'];
const EMOJI_TIPO_EVENTO = {
  'Pub': '🍻',
  'Bate e Volta': '🏍️',
  'Ação Social': '🏥',
  'Reunião': '📊'
};
function emojiTipoEvento(tipo) { return EMOJI_TIPO_EVENTO[tipo] || ''; }

// "Personalidade" visual de cada tipo, usada nos cards de evento da aba
// Eventos dos Relatorios (renderCardEvento). O fundo/borda de cada tipo vive
// no CSS como classe (.tipo-pub etc, ver logo abaixo de .event-card) - se
// fosse so cor inline no elemento, o toque em celular (.event-card:active)
// pararia de escurecer o card ao tocar, porque um estilo inline sempre
// ganha de qualquer regra do CSS, pseudo-classe incluida. So a cor "crua"
// (pro texto/borda do selinho de tipo, que nao tem estado de toque) fica
// aqui como hex.
const TIPO_EVENTO_CLASSE = {
  'Pub': 'tipo-pub',
  'Bate e Volta': 'tipo-bate-e-volta',
  'Ação Social': 'tipo-acao-social',
  'Reunião': 'tipo-reuniao'

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const API_URL = 'https://script.google.com/macros/s/AKfycbyotQH6FypFdkC6D42WQHszNiuG29wqIBal2jBcwXdoCsT-Om_0gyDxFE02hxfwrZegxw/exec';

// A API do Apps Script leva de 2 a 4s numa conexao boa. No 4G do celular
// passa disso com folga, entao o limite precisa ser generoso.
const READ_TIMEOUT = 20000;
const READ_RETRIES = 2;

function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer = null;
    const cleanup = () => {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
    };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Falha de conexao')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    timer = setTimeout(() => {
      if (window[cbName]) { cleanup(); reject(new Error('A conexao demorou demais')); }
    }, timeoutMs);
  });
}

// Leitura e gravacao passam pelo mesmo caminho: o backend responde confirmando
// a operacao, entao nao e mais preciso gravar as cegas e reler para conferir.
// Lanca em caso de falha, em vez de devolver vazio - devolver vazio fazia o app
// confundir "nao consegui ler" com "nao tem nada salvo".
async function api(action, params) {
  const query = Object.keys(params || {})
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
    .join('&');
  const url = API_URL + '?action=' + encodeURIComponent(action) + (query ? '&' + query : '');

  let ultimoErro;
  for (let tentativa = 0; tentativa <= READ_RETRIES; tentativa++) {
    try {
      const r = await jsonp(url, READ_TIMEOUT);
      if (!r || !r.ok) throw new Error((r && r.erro) || 'A planilha recusou a operação');
      return r;
    } catch (e) {
      ultimoErro = e;
      console.error('Falha em', action, 'tentativa', tentativa + 1, e);
    }
  }
  throw ultimoErro;
}

// Rede de seguranca para quando a pagina esta sendo fechada: o sendBeacon e
// entregue pelo navegador mesmo depois da aba morrer. Nao da para conferir o
// resultado, mas e melhor que perder a marcacao.
function apiBeacon(action, params) {
  if (!navigator.sendBeacon) return false;
  const corpo = JSON.stringify(Object.assign({ action: action }, params));
  return navigator.sendBeacon(API_URL, new Blob([corpo], { type: 'text/plain;charset=utf-8' }));
}

// Usado so pela importacao de convocacao colada: o payload (lista de membros
// com status) pode passar do limite pratico de tamanho de uma URL de GET, ja
// que o api() normal manda tudo como query string. O doGet/doPost no Code.gs
// caem na mesma funcao executar(), entao o backend nao muda - so troca o
// transporte para um corpo JSON de verdade.
async function apiPost(action, params) {
  // Sem header de Content-Type de proposito: o fetch entao manda como
  // "text/plain" (o mesmo que o sendBeacon acima ja usa), que o navegador
  // trata como requisicao simples e nao dispara preflight OPTIONS - o Apps
  // Script nao responde a OPTIONS, entao um POST com Content-Type
  // "application/json" explicito falharia por CORS.
  const r = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action }, params))
  });
  const data = await r.json();
  if (!data || !data.ok) throw new Error((data && data.erro) || 'A planilha recusou a operação');
  return data;
}

// Usado nas telas do organizador, onde quem grava e uma pessoa so e um aviso

// A tela responde na hora e a gravacao corre por fora. Toques seguidos
// (status, depois Direto, depois Destacado) sao agrupados numa gravacao so.
const ESPERA_AGRUPAR = 600;
let timerGravacao = null;
let gravacaoEmCurso = false;
// Cada pendencia guarda um membro so, com o proprio eventId. Antes o app
// mandava a lista inteira de volta, e quem gravasse por ultimo apagava a
// confirmacao de quem tinha gravado antes.
let pendentes = {};

function chavePendencia(eventId, memberId) { return eventId + '|' + memberId; }

function setMemberStatus(memberId, patch) {
  // Sem a leitura confirmada, state.currentStatus pode estar vazio por falha de
  // rede, e a tela mostraria um estado que nao e o real.
  if (!state.statusLoaded) return;

  const atualizado = { ...getMemberStatus(memberId), ...patch };
  state.currentStatus = { ...state.currentStatus, [memberId]: atualizado };
  state.saveSeq++;
  state.saveState = 'saving';
  pendentes[chavePendencia(state.currentEventId, memberId)] = {
    eventoId: state.currentEventId,
    membroId: memberId,
    dados: atualizado
  };
  render();

  clearTimeout(timerGravacao);
  timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
}

// Os parametros trafegam pela URL, entao a lista de participantes vai como
// texto separado por virgula e so os campos que o backend usa sao enviados.
function paramsDeEvento(ev) {
  return {
    id: ev.id,
    nome: ev.nome,
    data: ev.data || '',
    horario: ev.horario || '',
    endereco: ev.endereco || '',
    outros: ev.outros || '',
    status: ev.status || 'ativo',
    categoria: ev.categoria || 'barra',
    tipo: ev.tipo || '',
    membroIds: (ev.memberIds || []).join(',')
  };
}

function paramsDePresenca(p) {
  return {
    eventoId: p.eventoId,
    membroId: p.membroId,
    status: p.dados.status || 'aguardando',
    direto: !!p.dados.direto,
    destacado: !!p.dados.destacado,
    acompanhado: !!p.dados.acompanhado
  };
}

async function gravarPendentes() {
  if (gravacaoEmCurso) {
    clearTimeout(timerGravacao);
    timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
    return;
  }
  const chaves = Object.keys(pendentes);
  if (!chaves.length) return;

  gravacaoEmCurso = true;
  const falhou = [];
  try {
    for (const chave of chaves) {
      const p = pendentes[chave];
      try {
        await api('presenca', paramsDePresenca(p));
        // So sai da fila se a mesma marcacao ainda estiver pendente: se o
        // membro mexeu de novo enquanto gravava, a nova versao fica.
        if (pendentes[chave] === p) delete pendentes[chave];
      } catch (e) {
        falhou.push(chave);
      }
    }
  } finally {
    gravacaoEmCurso = false;
  }

  state.saveState = falhou.length ? 'error' : 'saved';
  render();
  if (!falhou.length) {
    const seq = state.saveSeq;
    setTimeout(() => {
      if (seq === state.saveSeq && state.saveState === 'saved') {
        state.saveState = 'idle';
        render();
      }
    }, 2000);
  }
}

// Regera a aba Relatorio da planilha. Fica fora do caminho da confirmacao de
// propósito: gerar junto com cada marcacao dobrava o tempo que o membro espera.
async function gerarRelatorio() {
  state.relatorioState = 'gerando';
  state.relatorioErro = null;
  render();
  try {
    await api('relatorio');

    state.relatorioState = 'erro';

  if (state.relatorioState === 'ok') {
    setTimeout(() => {
      if (state.relatorioState === 'ok') { state.relatorioState = 'idle'; render(); }
    }, 4000);
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

// Hex ('#RRGGBB') pra rgba(...) com opacidade - usado nos tons de fundo bem
// transparentes das personalidades por tipo (renderHomeTipos/renderCardEvento).
function hexParaRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Escapa o texto normalmente (mesma seguranca de sempre) e so depois
// transforma em link o que parecer uma URL - nunca insere HTML vindo do
// texto em si, so envolve o trecho reconhecido numa tag <a>.
function linkify(str) {
  const escapado = escapeHtml(str);
  return escapado.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (match) => {
    // Pontuacao de fechamento de frase (. , ; : ! ? ) provavelmente nao faz
    // parte do link - tira do link e devolve depois dele.
    const corte = match.match(/[.,;:!?)\]]+$/);
    const sufixo = corte ? corte[0] : '';
    const url = sufixo ? match.slice(0, -sufixo.length) : match;
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#9cc4ff; text-decoration:underline; word-break:break-all;">${url}</a>${sufixo}`;
  });
}

function render() {
  const app = document.getElementById('app');
  if (state.loading) {
    app.innerHTML = '<div class="loading">Carregando…</div>';
    return;
  }
  if (state.loadError) {
    app.innerHTML = `
      <div class="crest-wrap">
        <img src="data:image/png;base64,${LOGO_B64}" alt="Insanos MC Brasil">
      </div>
      <div class="alert">
        <div class="alert-title">Não consegui carregar os dados</div>
        <div class="alert-msg">${escapeHtml(state.loadError)}.<br>Verifique sua conexão e tente de novo.</div>
      </div>
      <button class="btn block" data-action="retry-load">Tentar de novo</button>
    `;
    return;
  }
  if (state.view === 'home') return renderHome(app);
  if (state.view === 'event') return renderEvent(app);
  if (state.view === 'confirmados') return renderConfirmados(app);
  if (state.view === 'rank') return renderRank(app);
  if (state.view === 'rank-insights') return renderRankInsights(app);
  if (state.view === 'admin-divisoes') return renderDivisoes(app);
  if (state.view === 'admin-pin') return renderPin(app);
  if (state.view === 'admin') return renderAdmin(app);
  if (state.view === 'relatorio-divisoes') return renderRelatorioDivisoes(app);
  if (state.view === 'relatorio-pin') return renderRelatorioPin(app);
  if (state.view === 'relatorio') return renderRelatorioShell(app);
}

function renderHome(app) {
  if (!state.homeEventosAberto) return renderHomeInicio(app);
  if (!state.homeEscopo) return renderHomeEscolha(app);
  if (!state.homeTipo) return renderHomeTipos(app);
  return renderHomeEventos(app);
}

// Primeiro passo dentro de "Eventos": escolher a divisao, antes de ver
// qualquer evento. Cada card mostra quantos eventos ativos tem naquele
// escopo.
function renderHomeEscolha(app) {
  const contarAtivos = (chave) =>
    state.events.filter(ev => ev.categoria === chave && ev.status !== 'encerrado').length;
  app.innerHTML = `
    <div class="back-link on-photo" data-action="fechar-home-eventos">‹ Voltar</div>
    <div class="crest-wrap" style="margin-bottom: 8px;">
      <h1 style="font-size: 19px;">Eventos</h1>
      <div class="sub">Escolha a divisão</div>
    </div>
    ${escoposEmOrdemDeExibicao().map(e => {
      const n = contarAtivos(e.chave);
      return renderCardEscopo(e, 'select-home-escopo', n + ' ' + (n === 1 ? 'evento ativo' : 'eventos ativos'));
    }).join('')}
  `;
}

// Card de divisao reaproveitado nas 3 telas que listam divisoes - Regional
// ganha a arte tematica (nome ja desenhado nela, entao o texto do card fica
// escondido, so a seta e, quando fizer sentido, um contador por cima); as
// demais divisoes continuam so com nome (+ contador opcional) em texto.
// contagemTexto: string pronta ("N eventos ativos") ou null/vazio pra nao
// mostrar nada.
function renderCardEscopo(e, dataAction, contagemTexto) {
  const isRegional = e.chave === 'regional';
  // Divisao usa uma unica arte generica (so tem o rotulo "DIVISÃO" desenhado,
  // com espaco em branco embaixo) pra todas as divisoes de uma vez - por
  // isso, diferente do Regional, o nome de cada uma continua em HTML por
  // cima (a imagem nao tem como saber qual divisao e).
  const estiloFundo = isRegional
    ? `background-image:url('${IMG_REGIONAL}'); background-size:cover; background-position:center; border-left:3px solid ${COR_TODOS_EVENTOS};`
    : `background-image:url('${IMG_DIVISAO}'); background-size:cover; background-position:center; border-left:3px solid ${COR_DIVISAO};`;
  const conteudo = isRegional
    ? (contagemTexto ? `<div class="event-date-badge">${escapeHtml(contagemTexto)}</div><div></div>` : '<div></div>')
    : `<div><div class="name">${escapeHtml(e.nome)}</div>${contagemTexto ? `<div class="meta">${escapeHtml(contagemTexto)}</div>` : ''}</div>`;
  return `
    <div class="card event-card ${isRegional ? 'card-regional-home' : 'card-divisao-home'}" style="${estiloFundo}" data-action="${dataAction}" data-value="${e.chave}">
      ${conteudo}
      <div class="arrow">›</div>
    </div>
  `;
}

function formatDataBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

const MESES_ABREV = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

// Formato compacto para o selo do card na tela inicial - "09 SET" em vez de
// "09/09/2026", que não cabe bem num canto de card.
function formatDataCurta(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  const mesIndice = Number(m) - 1;
  if (!d || mesIndice < 0 || mesIndice > 11) return '';
  return `${d} ${MESES_ABREV[mesIndice]}`;
}

// Quanto menor o grau (I antes de X), maior o cargo - aparece primeiro.
// Quem nao tem grau cadastrado fica no fim, em ordem alfabetica.
function ordenarPorHierarquia(membros) {
  const indice = (m) => { const i = GRAUS.indexOf(m.grau); return i === -1 ? GRAUS.length : i; };
  return [...membros].sort((a, b) => indice(a) - indice(b) || a.nome.localeCompare(b.nome));
}

// ========================================================================
// PARSER DA CONVOCACAO COLADA (tela "Relatorios")
// Le o texto que o clube ja manda pronto no WhatsApp e transforma em
// { evento, membrosParsed, avisos } - funcao pura, sem tocar em state/DOM,
// pra dar pra testar/ajustar so olhando entrada e saida.
// ========================================================================

const EMOJI_RE = /[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}️]/gu;
function stripEmoji(s) { return s.replace(EMOJI_RE, ''); }

function normalizarNome(s) {
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Distancia de edicao simples (Levenshtein) - nomes de membro sao curtos, o
// custo O(n*m) nao pesa.
function distanciaLevenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const linha = new Array(n + 1);
  for (let j = 0; j <= n; j++) linha[j] = j;
  for (let i = 1; i <= m; i++) {
    let anterior = linha[0];
    linha[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = linha[j];
      linha[j] = a[i - 1] === b[j - 1]
        ? anterior
        : 1 + Math.min(anterior, linha[j], linha[j - 1]);
      anterior = temp;
    }
  }
  return linha[n];
}

// Sugestoes de "quer dizer" para um nome que nao bateu exato - so serve para
// erro de digitacao/apelido parecido; apelido sem nada em comum com o nome
// cadastrado (ex.: alcunha pura) nao e pego, e precisa de escolha manual.
function sugerirCorrespondencias(nomeParsedNorm, candidatos) {
  return candidatos
    .map(m => ({ membro: m, dist: distanciaLevenshtein(nomeParsedNorm, normalizarNome(m.nome)) }))
    .filter(c => c.dist <= Math.max(2, Math.ceil(nomeParsedNorm.length * 0.4)))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 3)
    .map(c => c.membro);
}

// Palavra reconhecida manda sobre o emoji quando os dois aparecem e nao
// batem (ex.: "✅ aguardando" na lista real - erro de digitacao humano, a
// palavra e que vale). Quem nao tem emoji nem palavra nenhuma cai em
// "infracional" junto com quem tem ⭕ explicito - decisao do clube: nao
// responder a convocacao e tratado igual a falta sem justificativa.
function statusDoResto(resto) {
  const semEmoji = stripEmoji(resto).trim();
  const palavra = normalizarNome(semEmoji);
  if (palavra.includes('confirmad')) return 'confirmado';
  if (palavra.includes('aguardand')) return 'aguardando';
  if (palavra.includes('trabalho')) return 'trabalho';
  if (palavra.includes('famil')) return 'familia';
  if (palavra.includes('infracional')) return 'infracional';
  if (palavra.includes('justificad')) return 'justificada';

  const temCheck = resto.includes('✅');
  const temX = resto.includes('❌');
  const temCirculo = resto.includes('⭕');
  const temAlerta = resto.includes('⚠️');

  if (!palavra && !temCheck && !temX && !temCirculo && !temAlerta) return 'infracional'; // nao respondeu
  if (temCheck) return 'confirmado';
  if (temCirculo) return 'infracional';
  if (temX) return 'justificada';
  if (temAlerta) return 'aguardando';
  return 'aguardando';
}

function parseConvocacaoTexto(texto) {
  const linhas = String(texto || '').split('\n').map(l => l.trim());
  const avisos = [];
  const evento = { nome: '', tipo: '', data: '', horario: '', endereco: '', outros: '' };

  // --- Titulo do evento: a ultima linha nao-vazia antes de uma linha
  // "Evento" (formato com secoes tipo "🎯 DESTINO 🎯"); sem essa linha
  // (formato mais simples, ex.: "Bate volta divisão Barra" logo na
  // primeira linha), usa a primeira linha nao vazia do texto inteiro.
  const idxEvento = linhas.findIndex(l => l.toLowerCase() === 'evento');
  if (idxEvento > 0) {
    for (let i = idxEvento - 1; i >= 0; i--) {
      if (linhas[i]) { evento.nome = stripEmoji(linhas[i]).trim(); break; }
    }
  } else {
    const primeiraLinha = linhas.find(l => l);
    if (primeiraLinha) evento.nome = stripEmoji(primeiraLinha).trim();
  }
  if (evento.nome) {
    const nomeNorm = normalizarNome(evento.nome);
    // Bate por palavra, nao pela frase inteira - "Bate volta" (sem o "e")
    // ainda precisa reconhecer o tipo "Bate e Volta".
    const tipoAchado = TIPOS_EVENTO.find(t => {
      const tokens = normalizarNome(t).split(' ').filter(tok => tok && tok !== 'e' && tok !== 'de');
      return tokens.every(tok => nomeNorm.includes(tok));
    });
    if (tipoAchado) evento.tipo = tipoAchado;
  }

  // --- Data: token tipo "09SET26" (dia+mes abreviado+ano) em qualquer
  // linha, ou "19/07/2026"/"19/07/26" (numerica, com barra) - tenta o
  // primeiro formato antes, ja que "SET" nunca bate com o padrao numerico.
  const matchData = texto.match(/(\d{1,2})\s*([A-ZÇ]{3})\s*(\d{2})\b/i);
  if (matchData) {
    const dia = matchData[1].padStart(2, '0');
    const mesIdx = MESES_ABREV.indexOf(matchData[2].toUpperCase());
    if (mesIdx !== -1) {
      const ano = 2000 + Number(matchData[3]);
      evento.data = `${ano}-${String(mesIdx + 1).padStart(2, '0')}-${dia}`;
    } else {
      avisos.push('Não reconheci o mês na data — confira o campo Data.');
    }
  } else {
    const matchDataNumerica = texto.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/);
    if (matchDataNumerica) {
      const dia = matchDataNumerica[1].padStart(2, '0');
      const mes = Number(matchDataNumerica[2]);
      const anoBruto = matchDataNumerica[3];
      const ano = anoBruto.length === 2 ? String(2000 + Number(anoBruto)) : anoBruto;
      if (mes >= 1 && mes <= 12) {
        evento.data = `${ano}-${String(mes).padStart(2, '0')}-${dia}`;
      } else {
        avisos.push('Não reconheci a data (mês inválido) — confira o campo Data.');
      }
    }
  }

  // --- Endereco: "Destino: X" numa linha so, ou (formato com secoes) entre
  // a linha "🎯 DESTINO 🎯" e a proxima secao ---
  const idxDestino = linhas.findIndex(l => /destino/i.test(l));
  if (idxDestino !== -1) {
    const matchDestinoInline = linhas[idxDestino].match(/destino\s*:\s*(.+)/i);
    if (matchDestinoInline && matchDestinoInline[1].trim()) {
      evento.endereco = stripEmoji(matchDestinoInline[1]).trim();
    } else {
      const enderecoLinhas = [];
      for (let i = idxDestino + 1; i < linhas.length; i++) {
        const l = linhas[i];
        if (!l) continue;
        if (/^\.{4,}$/.test(l) || /horários/i.test(l) || /⏰/.test(l) || /^resposta\s*:?\s*$/i.test(l)) break;
        if (/^https?:\/\//i.test(l)) { evento.outros = evento.outros ? evento.outros + '\n' + l : l; continue; }
        enderecoLinhas.push(l);
      }
      evento.endereco = enderecoLinhas.join(', ');
    }
  }

  // --- Horarios: Destacamento / Briefing / Inicio ---
  const normalizaHora = (h) => {
    const m = h.match(/(\d{1,2})h(\d{0,2})/i);
    if (!m) return h;
    return `${m[1].padStart(2, '0')}:${(m[2] || '00').padStart(2, '0')}`;
  };
  const extrasHorario = [];
  linhas.forEach(l => {
    const mIni = l.match(/in[íi]cio[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mIni) { evento.horario = normalizaHora(mIni[1]); return; }
    const mDest = l.match(/destacamento[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mDest) { extrasHorario.push('Destacamento: ' + normalizaHora(mDest[1])); return; }
    const mBrief = l.match(/briefing[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mBrief) { extrasHorario.push('Briefing: ' + normalizaHora(mBrief[1])); return; }
  });
  if (extrasHorario.length) {
    evento.outros = evento.outros ? evento.outros + '\n' + extrasHorario.join(' · ') : extrasHorario.join(' · ');
  }

  // --- Lista de membros ---
  // Duas convencoes vistas na pratica: um cabecalho "👥 MEMBROS 👥" (com
  // numeracao "01. Nome (Grau) status") ou simplesmente uma linha "Lista:"
  // seguida dos nomes sem numero (ex.: "Costa(VI)✅").
  const idxMembros = linhas.findIndex(l => /membros/i.test(l) || /^lista\s*:?\s*$/i.test(l));
  const membrosParsed = [];
  if (idxMembros !== -1) {
    let divisaoAtual = '';
    // Nome tolera qualquer caixa (maiuscula/minuscula/acentuada) - a
    // convocacao real vem toda em CAIXA ALTA, mas um nome digitado errado
    // (ou colado de outro lugar) nao pode sumir da lista silenciosamente.
    // O numero antes do nome e opcional (algumas listas nao numeram); o
    // grau aceita qualquer texto entre parenteses, nao so numeral romano -
    // um grau fora do padrao (ex.: "camisa") ainda entra na lista, so com
    // aviso pra conferir na revisao, em vez de sumir sem explicacao.
    const memberRe = /^(?:(\d{1,3})\.\s*)?([A-Za-zÀ-ÖØ-öø-ÿ0-9][A-Za-zÀ-ÖØ-öø-ÿ0-9 .'\-]*?)\s*\(([^)]+)\)\s*(.*)$/;
    for (let i = idxMembros + 1; i < linhas.length; i++) {
      const l = linhas[i];
      if (/^participa[çc][ãa]o/i.test(l)) break; // legenda - fim da lista
      if (/^divis[ãa]o\s+/i.test(l)) { divisaoAtual = l.replace(/^divis[ãa]o\s+/i, 'Divisão ').trim(); continue; }
      const m = l.match(memberRe);
      if (!m) continue;
      const [, numeroBruto, nomeTexto, grauBruto, resto] = m;
      const numero = numeroBruto || String(membrosParsed.length + 1).padStart(2, '0');
      const grau = grauBruto.trim().toUpperCase();
      if (GRAUS.indexOf(grau) === -1) avisos.push(`Grau "${grauBruto.trim()}" (${nomeTexto.trim()}) não reconhecido — confira antes de confirmar.`);
      membrosParsed.push({
        numero,
        nomeTexto: nomeTexto.trim(),
        grauTexto: grau,
        divisaoTexto: divisaoAtual,
        status: statusDoResto(resto),
        direto: resto.includes('🚀'),
        destacado: resto.includes('🚧'),
        acompanhado: resto.includes('🐯'),
        membroId: null,
        ignorado: false,
        sugestoes: []
      });
    }
  } else {
    avisos.push('Não encontrei a lista de membros (procure por uma seção "MEMBROS" ou "Lista:") no texto colado.');
  }

  return { evento, membrosParsed, avisos };
}

// Casa cada membro lido do texto com o cadastro (state.roster), por nome
// normalizado; quem nao bate exato recebe sugestoes por semelhanca. Nao
// muda nada em state.roster - so preenche membroId/sugestoes de cada linha.
function resolverParsedComRoster(membrosParsed, escopoChave) {
  const candidatosBase = escopoChave === 'regional'
    ? state.roster
    : state.roster.filter(m => m.divisao === escopoPorChave(escopoChave).nome);

  return membrosParsed.map(row => {
    const candidatos = escopoChave === 'regional' && row.divisaoTexto
      ? state.roster.filter(m => normalizarNome(m.divisao).includes(normalizarNome(row.divisaoTexto).replace('divisao ', '')))
      : candidatosBase;
    const pool = candidatos.length ? candidatos : candidatosBase;
    const alvoNorm = normalizarNome(row.nomeTexto);
    const exato = pool.find(m => normalizarNome(m.nome) === alvoNorm);
    if (exato) return { ...row, membroId: exato.id };
    return { ...row, membroId: null, sugestoes: sugerirCorrespondencias(alvoNorm, pool) };
  });
}

// So usado em eventos regionais: agrupa os participantes pela divisao de
// cada um (ordem alfabetica do nome da divisao), com a hierarquia aplicada
// dentro de cada grupo. Funciona desde ja porque cada membro ja carrega a
// propria divisao - so vai mostrar mais de um grupo quando existir membro
// de outra divisao alem da Barra.
function agruparPorDivisao(membros) {
  const porDivisao = {};
  membros.forEach(m => {
    const chave = m.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(m);
  });
  // Regional no topo, depois alfabetica - mesma regra de
  // escoposEmOrdemDeExibicao(), so que aqui os nomes vem direto dos membros
  // (string), nao da lista ESCOPOS.
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return ordenadas.map(divisao => ({
    divisao,
    membros: ordenarPorHierarquia(porDivisao[divisao])
  }));
}

// Contagem ao vivo de um grupo, lida do status atual do evento aberto
// (state.currentStatus) - atualiza sozinha a cada confirmacao, igual o
// resto da tela.
function contagemGrupo(membros) {
  const c = { confirmado: 0, aguardando: 0, faltam: 0 };
  membros.forEach(m => {
    const st = getMemberStatus(m.id).status;
    if (st === 'confirmado') c.confirmado++;
    else if (st === 'familia' || st === 'trabalho' || st === 'infracional' || st === 'justificada') c.faltam++;
    else c.aguardando++;
  });
  return c;
}

// Clicavel: abre/fecha a lista de nomes daquela divisao. A contagem e a %
// aparecem sempre, mesmo fechado - só os nomes ficam escondidos ate abrir.
function renderSubtituloDivisao(nome, membros, aberto) {
  const c = contagemGrupo(membros);
  const pct = membros.length ? Math.round((c.confirmado / membros.length) * 100) : 0;
  return `
    <div class="division-subheader clicavel" data-action="toggle-divisao-grupo" data-value="${escapeHtml(nome)}">
      <span>${aberto ? '▾' : '▸'} ${escapeHtml(nome.toUpperCase())}</span>
      <span class="division-counts">
        ✅ ${c.confirmado} &nbsp; ⚠️ ${c.aguardando} &nbsp; ❌ ${c.faltam} &nbsp;·&nbsp; <b>${pct}%</b>
      </span>
    </div>
  `;
}

// Eventos de divisao: lista unica, ordenada por hierarquia. Eventos
// regionais: agrupados por divisao (cada grupo com o proprio subtitulo,
// contagem ao vivo e numeracao reiniciando do 01) - os nomes so aparecem na
// divisao que a pessoa abrir, pra nao rolar por todo mundo ate achar o
// proprio nome.
function renderListaMembros(ev, members) {
  if (ev.categoria === 'regional') {
    return agruparPorDivisao(members).map(grupo => {
      const aberto = state.expandedDivisoes.has(grupo.divisao);
      return `
        ${renderSubtituloDivisao(grupo.divisao, grupo.membros, aberto)}
        ${aberto ? grupo.membros.map((m, i) => renderMemberRow(m, i)).join('') : ''}
      `;
    }).join('');
  }
  return ordenarPorHierarquia(members).map((m, i) => renderMemberRow(m, i)).join('');
}

// Tela cheia (nao um painel dentro do evento) com quem ja confirmou -
// mesmo visual da lista de membros (numero, nome, grau, selos de

  const ev = state.events.find(e => e.id === state.currentEventId);

  app.innerHTML = `

function renderEvent(app) {

}

// Enquanto a leitura nao confirma, a lista aparece esmaecida e nao aceita
// toque: o que esta na tela ainda nao e o dado real da planilha.
function renderStatusBanner() {
  if (state.statusError) {
    return `
      <div class="alert">
        <div class="alert-title">Não consegui carregar as confirmações</div>
        <div class="alert-msg">${escapeHtml(state.statusError)}.<br>A lista abaixo não é a de verdade, por isso está bloqueada.</div>
        <button class="btn secondary block" data-action="retry-status" style="margin-top:10px;">Tentar de novo</button>
      </div>
    `;
  }
  if (!state.statusLoaded) {
    return '<div class="alert info"><div class="alert-msg">Carregando as confirmações…</div></div>';
  }
  if (state.saveState === 'saving') {
    return '<div class="alert info"><div class="alert-msg">Salvando… pode continuar marcando.</div></div>';
  }
  if (state.saveState === 'saved') {
    return '<div class="alert ok"><div class="alert-msg">✅ Salvo na planilha</div></div>';
  }
  if (state.saveState === 'error') {
    return `
      <div class="alert">
        <div class="alert-title">Ainda não salvou</div>
        <div class="alert-msg">Suas marcações estão na tela, mas não chegaram na planilha.<br>Não feche antes de salvar.</div>
        <button class="btn secondary block" data-action="retry-save" style="margin-top:10px;">Tentar salvar de novo</button>
      </div>
    `;
  }
  return '';
}

  const travado = !state.statusLoaded;

    <div class="member-row${travado ? ' travado' : ''}">

        <div class="member-info-wrap">
        <div class="member-info">
          <span class="member-num">${String(i + 1).padStart(2, '0')}.</span>
          <span class="member-name">${escapeHtml(m.nome)}</span>
          ${m.grau ? `<span class="grade-box">${escapeHtml(m.grau)}</span>` : ''}
          ${st.direto ? '<span title="Direto">🚀</span>' : ''}
          ${st.destacado ? '<span title="Voluntário destacado">🚧</span>' : ''}
          ${st.acompanhado ? '<span title="Acompanhado">🐯</span>' : ''}
        </div>

            <button class="picker-btn ${st.status === key ? 'active' : ''}" data-action="set-status" data-id="${m.id}" data-status="${key}">

          <button class="toggle-chip ${st.destacado ? 'active' : ''}" data-action="toggle-destacado" data-id="${m.id}">🚧 Destacado</button>
          <button class="toggle-chip ${st.acompanhado ? 'active' : ''}" data-action="toggle-acompanhado" data-id="${m.id}">🐯 Acompanhado</button>
        </div>
      </div>
    </div>
  `;
}

// O PIN nunca e comparado no navegador - so o servidor sabe o valor certo.
// A pagina manda o que foi digitado e recebe de volta so um sim/nao.
async function checkPin() {
  if (state.pinVerificando) return;
  const val = document.getElementById('pin-field').value.trim();
  if (!val) return;
  state.pinVerificando = true;
  state.pinErro = null;
  render();
  try {
    const r = await api('verificarPin', { escopo: state.adminEscopo, pin: val });
    if (r.valido) {
      state.isAdmin = true;
      state.view = 'admin';
      state.adminTab = 'eventos';
    } else {
      state.pinErro = 'PIN incorreto.';
    }
  } catch (e) {
    state.pinErro = 'Não consegui verificar (' + e.message + '). Tente de novo.';
  }
  state.pinVerificando = false;
  render();
}

async function checkRelatorioPin() {

  try {
    const r = await api('verificarPin', { escopo: state.relatorioEscopo, pin: val });
    if (r.valido) {
      state.relatorioIsAdmin = true;
      state.view = 'relatorio';
      // A pagina principal depois do PIN e o "Resumo Relatorio" (os 5
      // donuts) - as outras 6 abas ficam a um clique de distancia.
      state.relatorioTab = 'resumo';
      state.relatorioColarStep = 'texto';
      state.relatorioTipoDetalhe = null;
      state.relatorioFiltroDivisao = 'todas';
      render();
      await loadReportData();
    } else {
      state.relatorioPinErro = 'PIN incorreto.';
    }
  } catch (e) {
    state.relatorioPinErro = 'Não consegui verificar (' + e.message + '). Tente de novo.';
  }
  state.relatorioPinVerificando = false;
  render();
}

// Painel unico da tela "Relatorios": cabecalho + 7 abas + o conteudo da aba
// ativa. E o analogo do renderAdmin() do Modo organizador, so que focado no
// fluxo de colar convocacao. As 4 ultimas abas (uma por TIPOS_EVENTO, nessa
// ordem especifica pedida) sao paginas fixas so de tabela - sem chips de
// periodo, sem grafico - filtradas aquele tipo.
const TIPOS_EVENTO_TABS_ORDEM = ['Pub', 'Bate e Volta', 'Reunião', 'Ação Social'];
const RELATORIO_TABS = [
  { chave: 'resumo', label: 'Resumo Relatório' },
  { chave: 'enviar', label: 'Enviar Relatório' },
  { chave: 'eventos', label: 'Eventos' },
  ...TIPOS_EVENTO_TABS_ORDEM.map(t => ({ chave: t, label: 'Relatório ' + t })),
];

// Nas abas que mostram dados agregados (tudo, exceto "Enviar", que ja tem
// seu proprio seletor de divisao pra convocacao colada), o Regional ganha
// um filtro por divisao no topo - "Todas" agrega o clube inteiro, uma
// divisao especifica restringe so aquela categoria. Ver
// eventosDoRelatorioEscopo()/membrosVisiveisRelatorio().
const ABAS_COM_FILTRO_DIVISAO = ['resumo', 'eventos', ...TIPOS_EVENTO_TABS_ORDEM];

function renderRelatorioFiltroDivisao() {
  if (state.relatorioEscopo !== 'regional' || !ABAS_COM_FILTRO_DIVISAO.includes(state.relatorioTab)) return '';
  const opcoes = [{ chave: 'todas', nome: 'Todas as divisões' }].concat(escoposEmOrdemDeExibicao());
  const nomeFiltroAtivo = opcoes.find(o => o.chave === state.relatorioFiltroDivisao).nome;
  return `
    <div class="card no-print" style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:8px;">Filtrar por divisão</div>
      <div class="chip-grid wide">
        ${opcoes.map(o => `
          <button class="chip-option ${state.relatorioFiltroDivisao === o.chave ? 'active' : ''}" data-action="set-relatorio-filtro-divisao" data-value="${o.chave}">${escapeHtml(o.nome)}</button>
        `).join('')}
      </div>
    </div>
    <div class="print-only" style="margin-bottom:10px; font-size:13px; color:var(--text-muted);">Filtro: ${escapeHtml(nomeFiltroAtivo)}</div>
  `;
}

function renderRelatorioShell(app) {
  // Ficha do membro fica "por cima" de qualquer aba - abre com o nome de
  // onde a pessoa veio (Resumo ou uma aba fixa de tipo) e o "Voltar" fecha
  // ela, devolvendo pra mesma aba/filtro, sem trocar state.relatorioTab.
  if (state.relatorioMembroFichaId) {
    app.innerHTML = `
      <div class="back-link on-photo no-print" data-action="fechar-ficha-membro">‹ Voltar ao relatório</div>
      ${renderFichaMembro(state.relatorioMembroFichaId)}
    `;
    return;
  }

  const conteudo = state.relatorioTab === 'eventos' ? conteudoRelatorioEventos()
    : state.relatorioTab === 'resumo' ? conteudoRelatorioPresenca()
    : state.relatorioTab === 'enviar' ? conteudoRelatorioColar()
    : TIPOS_EVENTO_TABS_ORDEM.includes(state.relatorioTab) ? conteudoRelatorioTipoFixo(state.relatorioTab)
    : conteudoRelatorioColar();

  app.innerHTML = `
    <div class="back-link on-photo no-print" data-action="go-relatorio-divisoes">‹ Trocar divisão</div>
    <div class="crest-wrap" style="margin-bottom: 8px;">
      <h1 style="font-size: 19px;">Relatórios</h1>
      <div class="sub">${escapeHtml(escopoPorChave(state.relatorioEscopo).nome)}</div>
    </div>
    <div class="tabs tabs-wrap no-print">
      ${RELATORIO_TABS.map(t => `<div class="tab ${state.relatorioTab === t.chave ? 'active' : ''}" data-action="relatorio-tab" data-tab="${t.chave}">${t.label}</div>`).join('')}
    </div>
    ${renderRelatorioFiltroDivisao()}
    ${conteudo}
  `;
}

function conteudoRelatorioColar() {
  if (state.relatorioColarStep === 'revisao') return conteudoRelatorioRevisao();
  if (state.relatorioColarStep === 'resultado') return conteudoRelatorioResultado();
  // So faz sentido escolher a divisao do relatorio quando o acesso foi pelo
  // PIN Regional - ele e chave-mestra, entao da pra colar tanto a
  // convocacao regional inteira (varias divisoes juntas) quanto a
  // convocacao de uma divisao especifica sem precisar do PIN dela. Fora do
  // Regional so existe uma opcao (a propria divisao), entao nao mostra nada.
  const seletorDivisao = state.relatorioEscopo === 'regional' && !state.relatorioEditandoEventoId ? `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:8px;">Essa convocação é de qual divisão?</div>
      <div class="chip-grid wide">
        ${escoposEmOrdemDeExibicao().map(e => `
          <button class="chip-option ${state.relatorioCategoriaAlvo === e.chave ? 'active' : ''}" data-action="set-relatorio-categoria" data-value="${e.chave}">${escapeHtml(e.nome)}</button>
        `).join('')}
      </div>
    </div>
  ` : '';
  const eventoEmCorrecao = state.relatorioEditandoEventoId ? state.events.find(e => e.id === state.relatorioEditandoEventoId) : null;
  const bannerCorrecao = eventoEmCorrecao ? `
    <div class="alert info" style="margin-bottom:14px;">
      <div class="alert-title">✏️ Corrigindo: ${escapeHtml(eventoEmCorrecao.nome)}</div>
      <div class="alert-msg">Cole a convocação corrigida abaixo. Ela substitui a lista de presença desse evento - não cria outro.</div>
      <div class="btn ghost" style="margin-top:8px; padding:2px 0;" data-action="cancelar-correcao-convocacao">Cancelar correção</div>
    </div>
  ` : '';
  return `
    ${bannerCorrecao}
    ${seletorDivisao}
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:8px;">Tipo de evento</div>
      <div class="chip-grid wide">
        ${TIPOS_EVENTO.map(t => `
          <button class="chip-option ${state.relatorioTipoEscolhido === t ? 'active' : ''}" data-action="set-relatorio-tipo" data-value="${escapeHtml(t)}">${emojiTipoEvento(t)} ${escapeHtml(t.toUpperCase())}</button>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <div class="field">
        <label>Cole aqui a convocação inteira (a mesma que vai pro WhatsApp)</label>
        <textarea id="relatorio-texto-field" rows="14" placeholder="Cole o texto da convocação, com a lista de membros e os status de cada um…">${escapeHtml(state.relatorioTextoBruto)}</textarea>
      </div>
      <button class="btn block" data-action="analisar-convocacao">Analisar</button>
    </div>
  `;
}

// Reabre o fluxo de colar convocacao apontado pra um evento ja existente
// (ver o botao "Corrigir" em renderCardEvento) - ao confirmar, salva por
// cima do mesmo evento (mesmo id) em vez de criar outro. So funciona pra
// eventos encerrados porque so esses nascem do fluxo de colar convocacao
// (criarEventoDeTexto sempre cria o evento ja encerrado).
function iniciarCorrecaoConvocacao(id) {
  const ev = state.events.find(e => e.id === id);
  if (!ev) return;
  state.relatorioEditandoEventoId = id;
  state.relatorioCategoriaAlvo = ev.categoria;
  state.relatorioTipoEscolhido = ev.tipo || null;
  state.relatorioTextoBruto = '';
  state.relatorioParsed = null;
  state.relatorioSalvarErro = null;
  state.relatorioDuplicidadeAviso = null;
  state.relatorioDuplicidadeConfirmada = false;
  state.relatorioTab = 'enviar';
  state.relatorioColarStep = 'texto';
  render();
}

function analisarConvocacao() {
  // Le direto do campo (nao so de state.relatorioTextoBruto) - o campo nao
  // dispara um re-render a cada letra digitada, entao o valor no state pode
  // ficar defasado se o navegador preencher o campo sem passar pelo evento
  // "input" (autofill, colar via menu de contexto em alguns navegadores).
  const campo = document.getElementById('relatorio-texto-field');
  if (campo) state.relatorioTextoBruto = campo.value;
  if (!state.relatorioTextoBruto.trim()) return;

  const parsed = parseConvocacaoTexto(state.relatorioTextoBruto);
  // Ao corrigir uma convocacao ja enviada, o texto colado de novo pode ser
  // so a lista corrigida, sem repetir data/horario/endereco/outros - sem
  // isso, um campo que o parser nao achou no texto novo apagaria o valor
  // que ja estava salvo em vez de manter.
  if (state.relatorioEditandoEventoId) {
    const original = state.events.find(e => e.id === state.relatorioEditandoEventoId);
    if (original) {
      ['nome', 'data', 'horario', 'endereco', 'outros'].forEach(campo => {
        if (!parsed.evento[campo]) parsed.evento[campo] = original[campo];
      });
    }
  }
  // O tipo escolhido nos botoes acima da caixa de texto vence o palpite do
  // parser (que so tenta adivinhar pelo titulo do texto colado) - mais
  // confiavel que depender do texto ter uma palavra reconhecivel.
  if (state.relatorioTipoEscolhido) parsed.evento.tipo = state.relatorioTipoEscolhido;
  // Casa os nomes contra a divisao escolhida (relatorioCategoriaAlvo), nao
  // contra o escopo de acesso (relatorioEscopo) - um organizador Regional
  // colando so a convocacao da Curicica precisa que os nomes batam com o
  // elenco da Curicica, nao com a planilha toda.
  parsed.membrosParsed = resolverParsedComRoster(parsed.membrosParsed, state.relatorioCategoriaAlvo || state.relatorioEscopo);
  // Foto do momento em que o parser terminou de rodar, antes de qualquer
  // correção manual - é o que mede "quão bem o parser se saiu", diferente
  // de naoResolvidos (que muda a cada correção feita na tela de revisão).
  parsed.autoResolvidos = parsed.membrosParsed.filter(r => r.membroId).length;
  state.relatorioParsed = parsed;
  state.relatorioColarStep = 'revisao';
  state.relatorioDuplicidadeAviso = null;
  state.relatorioDuplicidadeConfirmada = false;
  render();
}

// Mesma divisao (categoria) e mesma data ja tem outro evento gravado - sinal
// forte de convocacao colada duas vezes por engano (ou duplo clique em
// "Confirmar"). Nao bloqueia - so avisa, porque duas divisoes podem ter
// eventos legitimos no mesmo dia, ou o clube pode ter dois eventos no mesmo
// dia de fato. excluirId tira o proprio evento da conta ao corrigir uma
// convocacao ja enviada (ver iniciarCorrecaoConvocacao) - senao o evento
// sempre "bateria" contra ele mesmo.
function eventosPossivelmenteDuplicados(data, categoria, excluirId) {
  return state.events.filter(e => e.data === data && e.categoria === categoria && e.id !== excluirId);
}

const STATUS_TOTAIS_LABEL = {
  confirmado: 'confirmados', aguardando: 'aguardando', trabalho: 'faltas (trabalho)',
  familia: 'faltas (família)', justificada: 'faltas justificadas', infracional: 'faltas infracionais'
};

function conteudoRelatorioRevisao() {
  const parsed = state.relatorioParsed;
  if (!parsed) { state.relatorioColarStep = 'texto'; return conteudoRelatorioColar(); }
  const ev = parsed.evento;
  const membros = parsed.membrosParsed;
  const naoResolvidos = membros.filter(r => !r.membroId && !r.ignorado);
  const totais = {};
  membros.forEach(r => { if (!r.ignorado) totais[r.status] = (totais[r.status] || 0) + 1; });
  const categoriaAlvo = state.relatorioCategoriaAlvo || state.relatorioEscopo;
  const escopoNome = escopoPorChave(categoriaAlvo).nome;
  const candidatosDropdown = categoriaAlvo === 'regional'
    ? state.roster
    : state.roster.filter(m => m.divisao === escopoNome);

  return `
    <div class="btn ghost" style="margin-bottom:10px;" data-action="go-relatorio-texto">‹ Colar de novo</div>
    <div style="font-weight:600; font-size:15px; margin-bottom:2px;">Revisar antes de salvar</div>
    <div style="color:var(--text-muted); font-size:12.5px; margin-bottom:10px;">Divisão: ${escapeHtml(escopoNome)}</div>

    ${parsed.avisos.length ? `
      <div class="alert info" style="margin-bottom:14px;">
        ${parsed.avisos.map(a => `<div class="alert-msg">⚠️ ${escapeHtml(a)}</div>`).join('')}
      </div>
    ` : ''}

    <div class="card">
      <div class="field">
        <label>Nome do evento</label>
        <input type="text" id="rev-evento-nome" value="${escapeHtml(ev.nome)}">
      </div>
      <div id="rev-secao-tipo">
        <label>Tipo de evento</label>
        <div class="chip-grid wide" style="margin-bottom: 14px;">
          ${TIPOS_EVENTO.map(t => `
            <button class="chip-option ${ev.tipo === t ? 'active' : ''}" data-action="set-revisao-tipo" data-value="${escapeHtml(t)}">${emojiTipoEvento(t)} ${escapeHtml(t)}</button>
          `).join('')}
        </div>
        ${!ev.tipo ? '<div style="color:#C9A29C; font-size:12.5px; margin:-8px 0 14px;">Obrigatório — escolha o tipo antes de confirmar.</div>' : ''}
      </div>
      <div class="row-gap" style="margin-bottom: 0;">
        <div class="field" style="flex: 1; min-width: 130px;">
          <label>Data</label>
          <input type="date" id="rev-evento-data" value="${escapeHtml(ev.data)}">
          <div class="date-hint">D · M · A</div>
        </div>
        <div class="field" style="flex: 1; min-width: 100px;">
          <label>Horário</label>
          <input type="time" id="rev-evento-horario" value="${escapeHtml(ev.horario)}">
        </div>
      </div>
      ${!ev.data ? '<div style="color:#C9A29C; font-size:12.5px; margin:-8px 0 14px;">Sem data no texto colado — preencha antes de confirmar.</div>' : ''}
      <div class="field">
        <label>Endereço</label>
        <input type="text" id="rev-evento-endereco" value="${escapeHtml(ev.endereco)}">
      </div>
      <div class="field">
        <label>Outros (opcional)</label>
        <textarea id="rev-evento-outros" rows="2">${escapeHtml(ev.outros)}</textarea>
      </div>
    </div>

    <div class="card" id="rev-membros-lista" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:4px;">Membros lidos da lista (${membros.length})</div>
      <div style="font-size:12.5px; margin-bottom:10px; color:${parsed.autoResolvidos === membros.length ? 'var(--status-confirmado)' : 'var(--text-muted)'};">
        ${parsed.autoResolvidos === membros.length ? '✅' : '⚠️'} ${parsed.autoResolvidos} de ${membros.length} nomes reconhecidos automaticamente${parsed.autoResolvidos < membros.length ? ' — confira os demais abaixo' : ''}
      </div>
      <div class="revisao-list">
        ${membros.map((r, i) => renderLinhaRevisao(r, i, candidatosDropdown)).join('')}
      </div>
    </div>

    ${naoResolvidos.length ? `
      <div class="alert" style="margin-top:14px;">
        <div class="alert-title">${naoResolvidos.length} nome(s) sem correspondência</div>
        <div class="alert-msg">Escolha o membro certo (ou "Ignorar") na lista acima antes de confirmar.</div>
      </div>
    ` : ''}

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:6px;">Resumo</div>
      ${Object.keys(STATUS_TOTAIS_LABEL).map(k => `<div class="info-line">${totais[k] || 0} ${STATUS_TOTAIS_LABEL[k]}</div>`).join('')}
    </div>

    ${state.relatorioSalvarErro ? `
      <div class="alert" style="margin-top:14px;">
        <div class="alert-title">Não consegui salvar</div>
        <div class="alert-msg">${escapeHtml(state.relatorioSalvarErro)}</div>
      </div>
    ` : ''}

    ${state.relatorioDuplicidadeAviso && state.relatorioDuplicidadeAviso.length ? `
      <div class="alert" style="margin-top:14px;">
        <div class="alert-title">${state.relatorioDuplicidadeAviso.length === 1 ? 'Já existe um evento nessa data' : 'Já existem eventos nessa data'}</div>

          Em ${formatDataBR(ev.data)}, nessa divisão: ${state.relatorioDuplicidadeAviso.map(d => escapeHtml(d.nome)).join(', ')}. Confira se não é o mesmo evento antes de criar outro.
