const CLUBE_NOME = 'Insanos MC';
const ESCOPOS = [
  { chave: 'barra', nome: 'Barra - RJ4' },
  { chave: 'oeste', nome: 'Oeste - RJ4' },
  { chave: 'recreio', nome: 'Recreio - RJ4' },
  { chave: 'curicica', nome: 'Curicica - RJ4' },
  { chave: 'taquara', nome: 'Taquara - RJ4' },
  { chave: 'gardenia', nome: 'Gardênia - RJ4' },
  { chave: 'regional', nome: 'Regional RJ4' },
];
function escopoPorChave(chave) { return ESCOPOS.find(e => e.chave === chave) || ESCOPOS[0]; }

// Ordem pra listar as divisoes nas telas (organizador, tela inicial, rank):
// Regional no topo, depois as demais em ordem alfabetica do nome. Separado
// da ordem de declaracao de ESCOPOS, que fica com Barra primeiro por ser o
// valor padrao seguro (escopoPorChave cai nela se receber uma chave invalida).
function escoposEmOrdemDeExibicao() {
  return [...ESCOPOS].sort((a, b) => {
    if (a.chave === 'regional') return -1;
    if (b.chave === 'regional') return 1;
    return a.nome.localeCompare(b.nome);
  });
}

// So as 6 divisoes, sem Regional - o Insight e coisa de quem esta na base,
// nao da diretoria regional (ver calcularEstatisticasInsights no Code.gs).
function divisoesSemRegional() {
  return escoposEmOrdemDeExibicao().filter(e => e.chave !== 'regional');
}

// So Regional e Barra na tela de Relatorios (decisao do clube) - Modo
// organizador e a tela inicial continuam com as 7 divisoes normalmente
// (escoposEmOrdemDeExibicao). Nada e apagado no backend/planilha, e so
// filtro de exibicao aqui.
function escoposAtivos() {
  return escoposEmOrdemDeExibicao().filter(e => e.chave === 'regional' || e.chave === 'barra');
}

function genId() {

const API_URL = 'https://script.google.com/macros/s/AKfycbyotQH6FypFdkC6D42WQHszNiuG29wqIBal2jBcwXdoCsT-Om_0gyDxFE02hxfwrZegxw/exec';

// A API do Apps Script leva de 2 a 4s numa conexao boa. No 4G do celular
// passa disso com folga, entao o limite precisa ser generoso.
const READ_TIMEOUT = 20000;
const READ_RETRIES = 2;

function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer = null;
    const cleanup = () => {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
    };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Falha de conexao')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    timer = setTimeout(() => {
      if (window[cbName]) { cleanup(); reject(new Error('A conexao demorou demais')); }
    }, timeoutMs);
  });
}

// Leitura e gravacao passam pelo mesmo caminho: o backend responde confirmando
// a operacao, entao nao e mais preciso gravar as cegas e reler para conferir.
// Lanca em caso de falha, em vez de devolver vazio - devolver vazio fazia o app
// confundir "nao consegui ler" com "nao tem nada salvo".
async function api(action, params) {
  const query = Object.keys(params || {})
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
    .join('&');
  const url = API_URL + '?action=' + encodeURIComponent(action) + (query ? '&' + query : '');

  let ultimoErro;
  for (let tentativa = 0; tentativa <= READ_RETRIES; tentativa++) {
    try {
      const r = await jsonp(url, READ_TIMEOUT);
      if (!r || !r.ok) throw new Error((r && r.erro) || 'A planilha recusou a operação');
      return r;
    } catch (e) {
      ultimoErro = e;
      console.error('Falha em', action, 'tentativa', tentativa + 1, e);
    }
  }
  throw ultimoErro;
}

// Rede de seguranca para quando a pagina esta sendo fechada: o sendBeacon e
// entregue pelo navegador mesmo depois da aba morrer. Nao da para conferir o
// resultado, mas e melhor que perder a marcacao.
function apiBeacon(action, params) {
  if (!navigator.sendBeacon) return false;
  const corpo = JSON.stringify(Object.assign({ action: action }, params));
  return navigator.sendBeacon(API_URL, new Blob([corpo], { type: 'text/plain;charset=utf-8' }));
}

// Usado so pela importacao de convocacao colada: o payload (lista de membros
// com status) pode passar do limite pratico de tamanho de uma URL de GET, ja
// que o api() normal manda tudo como query string. O doGet/doPost no Code.gs
// caem na mesma funcao executar(), entao o backend nao muda - so troca o
// transporte para um corpo JSON de verdade.
async function apiPost(action, params) {
  // Sem header de Content-Type de proposito: o fetch entao manda como
  // "text/plain" (o mesmo que o sendBeacon acima ja usa), que o navegador
  // trata como requisicao simples e nao dispara preflight OPTIONS - o Apps
  // Script nao responde a OPTIONS, entao um POST com Content-Type
  // "application/json" explicito falharia por CORS.
  const r = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action }, params))
  });
  const data = await r.json();
  if (!data || !data.ok) throw new Error((data && data.erro) || 'A planilha recusou a operação');
  return data;
}

// Usado nas telas do organizador, onde quem grava e uma pessoa so e um aviso
// direto resolve.
async function salvarOuAvisar(action, params) {
  try {
    return await api(action, params);
  } catch (e) {
    alert('Não consegui salvar na planilha.\n\n' + e.message + '.\n\nVerifique sua conexão e tente de novo.');
    await loadInitial();
    return null;
  }
}

async function loadInitial() {
  state.loading = true;
  state.loadError = null;
  render();
  try {
    const r = await api('dados');
    state.roster = r.membros || [];
    state.events = r.eventos || [];
  } catch (e) {
    state.loadError = e.message;
  }
  state.loading = false;
  render();
}

async function loadEventStatus(eventId) {
  state.statusLoaded = false;
  state.statusError = null;
  render();
  try {
    const r = await api('presencas', { eventoId: eventId });
    if (state.currentEventId !== eventId) return;
    state.currentStatus = r.presencas || {};
    state.statusLoaded = true;
  } catch (e) {
    if (state.currentEventId !== eventId) return;
    state.statusError = e.message;
  }
  render();
}

function getMemberStatus(memberId) {
  return state.currentStatus[memberId] || { status: 'aguardando', direto: false, destacado: false, acompanhado: false };
}

let timerGravacao = null;
let gravacaoEmCurso = false;
// Cada pendencia guarda um membro so, com o proprio eventId. Antes o app
// mandava a lista inteira de volta, e quem gravasse por ultimo apagava a
// confirmacao de quem tinha gravado antes.
let pendentes = {};

function chavePendencia(eventId, memberId) { return eventId + '|' + memberId; }

function setMemberStatus(memberId, patch) {
  // Sem a leitura confirmada, state.currentStatus pode estar vazio por falha de
  // rede, e a tela mostraria um estado que nao e o real.
  if (!state.statusLoaded) return;

  const atualizado = { ...getMemberStatus(memberId), ...patch };
  state.currentStatus = { ...state.currentStatus, [memberId]: atualizado };
  state.saveSeq++;
  state.saveState = 'saving';
  pendentes[chavePendencia(state.currentEventId, memberId)] = {
    eventoId: state.currentEventId,
    membroId: memberId,
    dados: atualizado
  };
  render();

  clearTimeout(timerGravacao);
  timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
}

// Os parametros trafegam pela URL, entao a lista de participantes vai como
// texto separado por virgula e so os campos que o backend usa sao enviados.
function paramsDeEvento(ev) {
  return {
    id: ev.id,
    nome: ev.nome,
    data: ev.data || '',
    horario: ev.horario || '',
    endereco: ev.endereco || '',
    outros: ev.outros || '',
    status: ev.status || 'ativo',
    categoria: ev.categoria || 'barra',
    tipo: ev.tipo || '',
    membroIds: (ev.memberIds || []).join(',')
  };
}

function paramsDePresenca(p) {
  return {
    eventoId: p.eventoId,
    membroId: p.membroId,
    status: p.dados.status || 'aguardando',
    direto: !!p.dados.direto,
    destacado: !!p.dados.destacado,
    acompanhado: !!p.dados.acompanhado
  };
}

async function gravarPendentes() {
  if (gravacaoEmCurso) {
    clearTimeout(timerGravacao);
    timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
    return;
  }
  const chaves = Object.keys(pendentes);
  if (!chaves.length) return;

  gravacaoEmCurso = true;
  const falhou = [];
  try {
    for (const chave of chaves) {
      const p = pendentes[chave];
      try {
        await api('presenca', paramsDePresenca(p));
        // So sai da fila se a mesma marcacao ainda estiver pendente: se o
        // membro mexeu de novo enquanto gravava, a nova versao fica.
        if (pendentes[chave] === p) delete pendentes[chave];
      } catch (e) {
        falhou.push(chave);
      }
    }
  } finally {
    gravacaoEmCurso = false;
  }

  state.saveState = falhou.length ? 'error' : 'saved';
  render();
  if (!falhou.length) {
    const seq = state.saveSeq;
    setTimeout(() => {
      if (seq === state.saveSeq && state.saveState === 'saved') {
        state.saveState = 'idle';
        render();
      }
    }, 2000);
  }
}

  // outra data" estiver aberto (ver blocoMarcacao); vazio = usa hoje, igual
  // sempre foi (nao muda nada pra quem nunca mexe nesse campo).
  const campoData = document.getElementById('insight-data-field');
  const dataEscolhida = campoData ? campoData.value : '';
  state.insightSalvando = true;
  state.insightErro = null;
  render();
  try {
    const params = { marcacoes: JSON.stringify(state.insightMarcacoes) };
    if (dataEscolhida) params.data = dataEscolhida;
    const r = await api('insightSalvar', params);
    state.insightResultado = { percentual: r.percentual, totalSim: r.totalSim, totalElegiveis: r.totalElegiveis };

    state.insightDataEscolhida = '';
    await loadInsightStats();
  } catch (e) {
    state.insightErro = e.message;
  }
  state.insightSalvando = false;
  render();
}

// Abre o modo de ajuste pra uma rodada ja registrada: reaproveita
// insightMarcacoes (mesmo campo usado pra marcar uma rodada nova), so que
// pre-preenchido com o "Fez"/"Nao" que a rodada ja tinha, em vez de comecar
// tudo zerado.
function iniciarAjusteInsightRodada(id) {
  const r = (state.insightRodadasHistorico || []).find(x => x.id === id);
  if (!r) return;
  state.insightEditandoRodadaId = id;
  state.insightMarcacoes = {};
  state.insightAjusteInfo = {};
  (r.membros || []).forEach(m => {
    state.insightMarcacoes[m.id] = m.fez;
    state.insightAjusteInfo[m.id] = { nome: m.nome, divisao: m.divisao };
  });
  state.insightAjusteMembroIds = (r.membros || []).map(m => m.id);
  state.insightAjusteMostrarAdicionar = false;
  state.insightAjusteDivisoesExpandidas = new Set();
  state.insightResultado = null;
  state.insightErro = null;
  render();
}

function cancelarAjusteInsightRodada() {
  state.insightEditandoRodadaId = null;
  state.insightAjusteMembroIds = [];
  state.insightAjusteInfo = {};
  state.insightAjusteMostrarAdicionar = false;
  state.insightAjusteDivisoesExpandidas = new Set();
  state.insightMarcacoes = {};
  (state.insightStats ? state.insightStats.membros : []).forEach(m => { state.insightMarcacoes[m.id] = false; });
  render();
}

async function salvarAjusteInsightRodada() {
  // Mesma trava do Code.gs (ajustarInsightRodada) - checa aqui tambem pra
  // nem gastar uma ida ao servidor com um ajuste que ia falhar de qualquer
  // jeito.
  if (!state.insightAjusteMembroIds.length) {
    state.insightErro = 'A rodada precisa ficar com pelo menos 1 integrante.';
    return render();
  }
  const id = state.insightEditandoRodadaId;
  state.insightSalvando = true;
  state.insightErro = null;
  render();
  try {
    const r = await api('insightRodadaAjustar', {
      id,
      marcacoes: JSON.stringify(state.insightMarcacoes),
      membroIds: state.insightAjusteMembroIds.join(',')
    });
    state.insightResultado = { ajuste: true, percentual: r.percentual, totalSim: r.totalSim, totalElegiveis: r.totalElegiveis };
    state.insightEditandoRodadaId = null;
    state.insightAjusteMembroIds = [];
    state.insightAjusteInfo = {};
    state.insightAjusteMostrarAdicionar = false;
    state.insightAjusteDivisoesExpandidas = new Set();
    await loadInsightStats();
  } catch (e) {
    state.insightErro = e.message;
  }
  state.insightSalvando = false;
  render();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

// Hex ('#RRGGBB') pra rgba(...) com opacidade - usado nos tons de fundo bem
// transparentes das personalidades por tipo (renderHomeTipos/renderCardEvento).
function hexParaRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Escapa o texto normalmente (mesma seguranca de sempre) e so depois
// transforma em link o que parecer uma URL - nunca insere HTML vindo do
// texto em si, so envolve o trecho reconhecido numa tag <a>.
function linkify(str) {
  const escapado = escapeHtml(str);
  return escapado.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (match) => {
    // Pontuacao de fechamento de frase (. , ; : ! ? ) provavelmente nao faz
    // parte do link - tira do link e devolve depois dele.
    const corte = match.match(/[.,;:!?)\]]+$/);
    const sufixo = corte ? corte[0] : '';
    const url = sufixo ? match.slice(0, -sufixo.length) : match;
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#9cc4ff; text-decoration:underline; word-break:break-all;">${url}</a>${sufixo}`;
  });
}

function render() {
  const app = document.getElementById('app');
  if (state.loading) {
    app.innerHTML = '<div class="loading">Carregando…</div>';
    return;
  }
  if (state.loadError) {
    app.innerHTML = `
      <div class="crest-wrap">
        <img src="${LOGO_SRC}" alt="Insanos MC Brasil">
      </div>
      <div class="alert">
        <div class="alert-title">Não consegui carregar os dados</div>
        <div class="alert-msg">${escapeHtml(state.loadError)}.<br>Verifique sua conexão e tente de novo.</div>
      </div>
      <button class="btn block" data-action="retry-load">Tentar de novo</button>
    `;
    return;
  }
  if (state.view === 'home') return renderHome(app);
  if (state.view === 'event') return renderEvent(app);
  if (state.view === 'confirmados') return renderConfirmados(app);
  if (state.view === 'rank') return renderRank(app);
  if (state.view === 'rank-insights') return renderRankInsights(app);
  if (state.view === 'admin-divisoes') return renderDivisoes(app);
  if (state.view === 'admin-pin') return renderPin(app);
  if (state.view === 'admin') return renderAdmin(app);
  if (state.view === 'relatorio-divisoes') return renderRelatorioDivisoes(app);
  if (state.view === 'relatorio-pin') return renderRelatorioPin(app);
  if (state.view === 'relatorio') return renderRelatorioShell(app);
  if (state.view === 'calendario-divisoes') return renderCalendarioDivisoes(app);
  if (state.view === 'calendario') return renderCalendario(app);
}

function renderHome(app) {
  if (!state.homeEventosAberto) return renderHomeInicio(app);
  if (!state.homeEscopo) return renderHomeEscolha(app);
  if (!state.homeTipo) return renderHomeTipos(app);
  return renderHomeEventos(app);

function renderRankConteudo(d) {
  const porChave = chave => d.divisoes.find(x => x.chave === chave);
  const linhaPct = v => v === null || v === undefined ? '—' : v + '%';

  // Soma de tudo (todas as divisoes + Regional juntas) - a base de presenca
  // da RJ4 inteira, calculada em cima do que ja veio do servidor, sem
  // precisar de outra chamada.
  const totalConvites = d.divisoes.reduce((soma, x) => soma + x.convites, 0);
  const totalConfirmacoes = d.divisoes.reduce((soma, x) => soma + x.confirmacoes, 0);
  const totalPct = totalConvites ? Math.round((totalConfirmacoes / totalConvites) * 100) : null;

  const cardTotal = `
    <div class="card" style="padding: 14px 16px; margin-bottom:12px; border-color: var(--line-strong);">
      <div class="member-row" style="border-bottom:none; padding:0;">
        <div class="member-head" style="cursor:default;">
          <span class="member-name" style="font-family:'Rye',serif; font-size:17px;">🏆 Rank Total Regional</span>
          <span class="status-badge status-confirmado" style="font-size:15px; padding:7px 14px;">${linhaPct(totalPct)}</span>
        </div>
      </div>
    </div>
  `;

  const blocoDivisoes = `
    <div class="card" style="padding: 4px 16px; margin-bottom:16px;">
      ${escoposEmOrdemDeExibicao().map(e => {
        const item = porChave(e.chave);
        return `
          <div class="member-row">
            <div class="member-head">
              <span class="member-name">${escapeHtml(e.nome)}</span>
              <span class="status-badge status-confirmado">${linhaPct(item && item.percentual)}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  const blocoMembros = escoposEmOrdemDeExibicao().map(e => {
    const membros = d.membros
      .filter(m => m.divisao === e.nome)
      .sort((a, b) => a.nome.localeCompare(b.nome));
    const aberto = state.rankExpandedDivisoes.has(e.chave);
    return `
      <div class="card" style="padding: 4px 16px;">
        <div class="division-subheader clicavel" data-action="toggle-rank-divisao" data-value="${e.chave}">
          <span>${aberto ? '▾' : '▸'} ${escapeHtml(e.nome.toUpperCase())}</span>
          <span class="division-counts">${membros.length} ${membros.length === 1 ? 'membro' : 'membros'}</span>
        </div>
        ${aberto ? (membros.length === 0 ? '<div class="empty">Nenhum membro cadastrado.</div>' : membros.map(m => `
          <div class="member-row">
            <div class="member-head">
              <span class="member-name">${escapeHtml(m.nome)}</span>
              <span class="status-badge status-confirmado">${linhaPct(m.percentual)}</span>
            </div>
          </div>
        `).join('')) : ''}
      </div>
    `;
  }).join('');

  return cardTotal + blocoDivisoes + blocoMembros;
}

  // status de presenca.

        { label: 'Fez', value: totalConfirmacoes, cor: 'var(--status-confirmado)' },

      ${renderSparklineTendencia((state.insightRodadasHistorico || []).map(r => ({
        ev: { data: r.data, nome: 'Rodada de ' + formatDataBR(r.data) },
        pct: r.percentual
      })))}
    </div>
  `;

  const blocoDivisoes = `
    <div class="donut-grid" style="margin-bottom:16px;">
      ${divisoesSemRegional().map(e => {
        const item = porChave(e.chave);
        const fez = item ? item.mediaPorRodada : 0;
        const naoFez = Math.max(0, (item ? item.mediaTotalPorRodada : 0) - fez);
        return `
          <div class="card donut-card">
            <div style="font-weight:600; margin-bottom:8px;">${escapeHtml(e.nome)}</div>
            ${renderDonutChart([
              { label: 'Fez', value: fez, cor: 'var(--status-confirmado)' },
              { label: 'Não fez', value: naoFez, cor: 'var(--status-infracional)' },
            ], linhaPct(item && item.percentual), 'fazem', 110)}
            <div class="info-line" style="padding:8px 0 0; color:var(--text-muted); font-size:12px;">${fez}/${item ? item.mediaTotalPorRodada : 0} fazem, em média, por rodada</div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  const blocoMembros = divisoesSemRegional().map(e => {
    const membros = d.membros
      .filter(m => m.divisao === e.nome)
      .sort((a, b) => (b.percentual ?? -1) - (a.percentual ?? -1) || a.nome.localeCompare(b.nome));
    const aberto = state.insightRankExpandedDivisoes.has(e.chave);
    return `
      <div class="card" style="padding: 4px 16px;">
        <div class="division-subheader clicavel" data-action="toggle-insight-rank-divisao" data-value="${e.chave}">
          <span>${aberto ? '▾' : '▸'} ${escapeHtml(e.nome.toUpperCase())}</span>
          <span class="division-counts">${membros.length} ${membros.length === 1 ? 'membro' : 'membros'}</span>
        </div>
        <div class="insight-rank-membros" style="display:${aberto ? 'block' : 'none'};">
          ${membros.length === 0 ? '<div class="empty">Nenhum membro cadastrado.</div>' : membros.map(m => `
            <div class="member-row">
              <div class="member-head">
                <div class="member-info">
                  <span class="member-name">${escapeHtml(m.nome)}</span>
                  ${m.grau ? `<span class="grade-box">${escapeHtml(m.grau)}</span>` : ''}
                </div>
                <span class="status-badge status-confirmado">${linhaPct(m.percentual)}</span>

            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  return cardTotal + blocoDivisoes + blocoMembros;
}

function formatDataBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

const MESES_ABREV = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

// Formato compacto para o selo do card na tela inicial - "09 SET" em vez de
// "09/09/2026", que não cabe bem num canto de card.
function formatDataCurta(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  const mesIndice = Number(m) - 1;
  if (!d || mesIndice < 0 || mesIndice > 11) return '';
  return `${d} ${MESES_ABREV[mesIndice]}`;
}

// Quanto menor o grau (I antes de X), maior o cargo - aparece primeiro.
// Quem nao tem grau cadastrado fica no fim, em ordem alfabetica.
function ordenarPorHierarquia(membros) {
  const indice = (m) => { const i = GRAUS.indexOf(m.grau); return i === -1 ? GRAUS.length : i; };
  return [...membros].sort((a, b) => indice(a) - indice(b) || a.nome.localeCompare(b.nome));
}

// ========================================================================
// PARSER DA CONVOCACAO COLADA (tela "Relatorios")
// Le o texto que o clube ja manda pronto no WhatsApp e transforma em
// { evento, membrosParsed, avisos } - funcao pura, sem tocar em state/DOM,
// pra dar pra testar/ajustar so olhando entrada e saida.
// ========================================================================

const EMOJI_RE = /[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}️]/gu;
function stripEmoji(s) { return s.replace(EMOJI_RE, ''); }

function normalizarNome(s) {
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Distancia de edicao simples (Levenshtein) - nomes de membro sao curtos, o
// custo O(n*m) nao pesa.
function distanciaLevenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const linha = new Array(n + 1);
  for (let j = 0; j <= n; j++) linha[j] = j;
  for (let i = 1; i <= m; i++) {
    let anterior = linha[0];
    linha[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = linha[j];
      linha[j] = a[i - 1] === b[j - 1]
        ? anterior
        : 1 + Math.min(anterior, linha[j], linha[j - 1]);
      anterior = temp;
    }
  }
  return linha[n];
}

// Sugestoes de "quer dizer" para um nome que nao bateu exato - so serve para
// erro de digitacao/apelido parecido; apelido sem nada em comum com o nome
// cadastrado (ex.: alcunha pura) nao e pego, e precisa de escolha manual.
function sugerirCorrespondencias(nomeParsedNorm, candidatos) {
  return candidatos
    .map(m => ({ membro: m, dist: distanciaLevenshtein(nomeParsedNorm, normalizarNome(m.nome)) }))
    .filter(c => c.dist <= Math.max(2, Math.ceil(nomeParsedNorm.length * 0.4)))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 3)
    .map(c => c.membro);
}

// Palavra reconhecida manda sobre o emoji quando os dois aparecem e nao
// batem (ex.: "✅ aguardando" na lista real - erro de digitacao humano, a
// palavra e que vale). Quem nao tem emoji nem palavra nenhuma cai em
// "infracional" junto com quem tem ⭕ explicito - decisao do clube: nao
// responder a convocacao e tratado igual a falta sem justificativa.
function statusDoResto(resto) {
  const semEmoji = stripEmoji(resto).trim();
  const palavra = normalizarNome(semEmoji);
  if (palavra.includes('confirmad')) return 'confirmado';
  if (palavra.includes('aguardand')) return 'aguardando';
  if (palavra.includes('trabalho')) return 'trabalho';
  if (palavra.includes('famil')) return 'familia';
  if (palavra.includes('infracional')) return 'infracional';
  if (palavra.includes('justificad')) return 'justificada';

  const temCheck = resto.includes('✅');
  const temX = resto.includes('❌');
  const temCirculo = resto.includes('⭕');
  const temAlerta = resto.includes('⚠️');

  if (!palavra && !temCheck && !temX && !temCirculo && !temAlerta) return 'infracional'; // nao respondeu
  if (temCheck) return 'confirmado';
  if (temCirculo) return 'infracional';
  if (temX) return 'justificada';
  if (temAlerta) return 'aguardando';
  return 'aguardando';
}

function parseConvocacaoTexto(texto) {
  const linhas = String(texto || '').split('\n').map(l => l.trim());
  const avisos = [];
  const evento = { nome: '', tipo: '', data: '', horario: '', endereco: '', outros: '' };

  // --- Titulo do evento: a ultima linha nao-vazia antes de uma linha
  // "Evento" (formato com secoes tipo "🎯 DESTINO 🎯"); sem essa linha
  // (formato mais simples, ex.: "Bate volta divisão Barra" logo na
  // primeira linha), usa a primeira linha nao vazia do texto inteiro.
  const idxEvento = linhas.findIndex(l => l.toLowerCase() === 'evento');
  if (idxEvento > 0) {
    for (let i = idxEvento - 1; i >= 0; i--) {
      if (linhas[i]) { evento.nome = stripEmoji(linhas[i]).trim(); break; }
    }
  } else {
    const primeiraLinha = linhas.find(l => l);
    if (primeiraLinha) evento.nome = stripEmoji(primeiraLinha).trim();
  }
  if (evento.nome) {
    const nomeNorm = normalizarNome(evento.nome);
    // Bate por palavra, nao pela frase inteira - "Bate volta" (sem o "e")
    // ainda precisa reconhecer o tipo "Bate e Volta".
    const tipoAchado = TIPOS_EVENTO.find(t => {
      const tokens = normalizarNome(t).split(' ').filter(tok => tok && tok !== 'e' && tok !== 'de');
      return tokens.every(tok => nomeNorm.includes(tok));
    });
    if (tipoAchado) evento.tipo = tipoAchado;
  }

  // --- Data: token tipo "09SET26" (dia+mes abreviado+ano) em qualquer
  // linha, ou "19/07/2026"/"19/07/26" (numerica, com barra) - tenta o
  // primeiro formato antes, ja que "SET" nunca bate com o padrao numerico.
  const matchData = texto.match(/(\d{1,2})\s*([A-ZÇ]{3})\s*(\d{2})\b/i);
  if (matchData) {
    const dia = matchData[1].padStart(2, '0');
    const mesIdx = MESES_ABREV.indexOf(matchData[2].toUpperCase());
    if (mesIdx !== -1) {
      const ano = 2000 + Number(matchData[3]);
      evento.data = `${ano}-${String(mesIdx + 1).padStart(2, '0')}-${dia}`;
    } else {
      avisos.push('Não reconheci o mês na data — confira o campo Data.');
    }
  } else {
    const matchDataNumerica = texto.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/);
    if (matchDataNumerica) {
      const dia = matchDataNumerica[1].padStart(2, '0');
      const mes = Number(matchDataNumerica[2]);
      const anoBruto = matchDataNumerica[3];
      const ano = anoBruto.length === 2 ? String(2000 + Number(anoBruto)) : anoBruto;
      if (mes >= 1 && mes <= 12) {
        evento.data = `${ano}-${String(mes).padStart(2, '0')}-${dia}`;
      } else {
        avisos.push('Não reconheci a data (mês inválido) — confira o campo Data.');
      }
    }
  }

  // --- Endereco: "Destino: X" numa linha so, ou (formato com secoes) entre
  // a linha "🎯 DESTINO 🎯" e a proxima secao ---
  const idxDestino = linhas.findIndex(l => /destino/i.test(l));
  if (idxDestino !== -1) {
    const matchDestinoInline = linhas[idxDestino].match(/destino\s*:\s*(.+)/i);
    if (matchDestinoInline && matchDestinoInline[1].trim()) {
      evento.endereco = stripEmoji(matchDestinoInline[1]).trim();
    } else {
      const enderecoLinhas = [];
      for (let i = idxDestino + 1; i < linhas.length; i++) {
        const l = linhas[i];
        if (!l) continue;
        if (/^\.{4,}$/.test(l) || /horários/i.test(l) || /⏰/.test(l) || /^resposta\s*:?\s*$/i.test(l)) break;
        if (/^https?:\/\//i.test(l)) { evento.outros = evento.outros ? evento.outros + '\n' + l : l; continue; }
        enderecoLinhas.push(l);
      }
      evento.endereco = enderecoLinhas.join(', ');
    }
  }

  // --- Horarios: Destacamento / Briefing / Inicio ---
  const normalizaHora = (h) => {
    const m = h.match(/(\d{1,2})h(\d{0,2})/i);
    if (!m) return h;
    return `${m[1].padStart(2, '0')}:${(m[2] || '00').padStart(2, '0')}`;
  };
  const extrasHorario = [];
  linhas.forEach(l => {
    const mIni = l.match(/in[íi]cio[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mIni) { evento.horario = normalizaHora(mIni[1]); return; }
    const mDest = l.match(/destacamento[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mDest) { extrasHorario.push('Destacamento: ' + normalizaHora(mDest[1])); return; }
    const mBrief = l.match(/briefing[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mBrief) { extrasHorario.push('Briefing: ' + normalizaHora(mBrief[1])); return; }
  });
  if (extrasHorario.length) {
    evento.outros = evento.outros ? evento.outros + '\n' + extrasHorario.join(' · ') : extrasHorario.join(' · ');
  }

  // --- Lista de membros ---
  // Duas convencoes vistas na pratica: um cabecalho "👥 MEMBROS 👥" (com
  // numeracao "01. Nome (Grau) status") ou simplesmente uma linha "Lista:"
  // seguida dos nomes sem numero (ex.: "Costa(VI)✅").
  const idxMembros = linhas.findIndex(l => /membros/i.test(l) || /^lista\s*:?\s*$/i.test(l));
  const membrosParsed = [];
  if (idxMembros !== -1) {
    let divisaoAtual = '';
    // Nome tolera qualquer caixa (maiuscula/minuscula/acentuada) - a
    // convocacao real vem toda em CAIXA ALTA, mas um nome digitado errado
    // (ou colado de outro lugar) nao pode sumir da lista silenciosamente.
    // O numero antes do nome e opcional (algumas listas nao numeram); o
    // grau aceita qualquer texto entre parenteses, nao so numeral romano -
    // um grau fora do padrao (ex.: "camisa") ainda entra na lista, so com
    // aviso pra conferir na revisao, em vez de sumir sem explicacao.
    const memberRe = /^(?:(\d{1,3})\.\s*)?([A-Za-zÀ-ÖØ-öø-ÿ0-9][A-Za-zÀ-ÖØ-öø-ÿ0-9 .'\-]*?)\s*\(([^)]+)\)\s*(.*)$/;
    for (let i = idxMembros + 1; i < linhas.length; i++) {
      const l = linhas[i];
      if (/^participa[çc][ãa]o/i.test(l)) break; // legenda - fim da lista
      if (/^divis[ãa]o\s+/i.test(l)) { divisaoAtual = l.replace(/^divis[ãa]o\s+/i, 'Divisão ').trim(); continue; }
      const m = l.match(memberRe);
      if (!m) continue;
      const [, numeroBruto, nomeTexto, grauBruto, resto] = m;
      const numero = numeroBruto || String(membrosParsed.length + 1).padStart(2, '0');
      const grau = grauBruto.trim().toUpperCase();
      if (GRAUS.indexOf(grau) === -1) avisos.push(`Grau "${grauBruto.trim()}" (${nomeTexto.trim()}) não reconhecido — confira antes de confirmar.`);
      membrosParsed.push({
        numero,
        nomeTexto: nomeTexto.trim(),
        grauTexto: grau,
        divisaoTexto: divisaoAtual,
        status: statusDoResto(resto),
        direto: resto.includes('🚀'),
        destacado: resto.includes('🚧'),
        acompanhado: resto.includes('🐯'),
        membroId: null,
        ignorado: false,
        sugestoes: []
      });
    }
  } else {
    avisos.push('Não encontrei a lista de membros (procure por uma seção "MEMBROS" ou "Lista:") no texto colado.');
  }

  return { evento, membrosParsed, avisos };
}

// Casa cada membro lido do texto com o cadastro (state.roster), por nome
// normalizado; quem nao bate exato recebe sugestoes por semelhanca. Nao
// muda nada em state.roster - so preenche membroId/sugestoes de cada linha.
function resolverParsedComRoster(membrosParsed, escopoChave) {
  const candidatosBase = escopoChave === 'regional'
    ? state.roster
    : state.roster.filter(m => m.divisao === escopoPorChave(escopoChave).nome);

  return membrosParsed.map(row => {
    const candidatos = escopoChave === 'regional' && row.divisaoTexto
      ? state.roster.filter(m => normalizarNome(m.divisao).includes(normalizarNome(row.divisaoTexto).replace('divisao ', '')))
      : candidatosBase;
    const pool = candidatos.length ? candidatos : candidatosBase;
    const alvoNorm = normalizarNome(row.nomeTexto);
    const exato = pool.find(m => normalizarNome(m.nome) === alvoNorm);
    if (exato) return { ...row, membroId: exato.id };
    return { ...row, membroId: null, sugestoes: sugerirCorrespondencias(alvoNorm, pool) };
  });
}

// So usado em eventos regionais: agrupa os participantes pela divisao de
// cada um (ordem alfabetica do nome da divisao), com a hierarquia aplicada
// dentro de cada grupo. Funciona desde ja porque cada membro ja carrega a
// propria divisao - so vai mostrar mais de um grupo quando existir membro
// de outra divisao alem da Barra.
function agruparPorDivisao(membros) {
  const porDivisao = {};
  membros.forEach(m => {
    const chave = m.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(m);
  });
  // Regional no topo, depois alfabetica - mesma regra de
  // escoposEmOrdemDeExibicao(), so que aqui os nomes vem direto dos membros
  // (string), nao da lista ESCOPOS.
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return ordenadas.map(divisao => ({
    divisao,
    membros: ordenarPorHierarquia(porDivisao[divisao])
  }));
}

// Contagem ao vivo de um grupo, lida do status atual do evento aberto
// (state.currentStatus) - atualiza sozinha a cada confirmacao, igual o
// resto da tela.
function contagemGrupo(membros) {
  const c = { confirmado: 0, aguardando: 0, faltam: 0 };
  membros.forEach(m => {
    const st = getMemberStatus(m.id).status;
    if (st === 'confirmado') c.confirmado++;
    else if (st === 'familia' || st === 'trabalho' || st === 'infracional' || st === 'justificada') c.faltam++;
    else c.aguardando++;
  });
  return c;
}

// Clicavel: abre/fecha a lista de nomes daquela divisao. A contagem e a %
// aparecem sempre, mesmo fechado - só os nomes ficam escondidos ate abrir.
function renderSubtituloDivisao(nome, membros, aberto) {
  const c = contagemGrupo(membros);
  const pct = membros.length ? Math.round((c.confirmado / membros.length) * 100) : 0;
  return `
    <div class="division-subheader clicavel" data-action="toggle-divisao-grupo" data-value="${escapeHtml(nome)}">
      <span>${aberto ? '▾' : '▸'} ${escapeHtml(nome.toUpperCase())}</span>
      <span class="division-counts">
        ✅ ${c.confirmado} &nbsp; ⚠️ ${c.aguardando} &nbsp; ❌ ${c.faltam} &nbsp;·&nbsp; <b>${pct}%</b>
      </span>
    </div>
  `;
}

// Eventos de divisao: lista unica, ordenada por hierarquia. Eventos
// regionais: agrupados por divisao (cada grupo com o proprio subtitulo,
// contagem ao vivo e numeracao reiniciando do 01) - os nomes so aparecem na
// divisao que a pessoa abrir, pra nao rolar por todo mundo ate achar o
// proprio nome.
function renderListaMembros(ev, members) {
  if (ev.categoria === 'regional') {
    return agruparPorDivisao(members).map(grupo => {
      const aberto = state.expandedDivisoes.has(grupo.divisao);
      return `
        ${renderSubtituloDivisao(grupo.divisao, grupo.membros, aberto)}
        ${aberto ? grupo.membros.map((m, i) => renderMemberRow(m, i)).join('') : ''}
      `;
    }).join('');
  }
  return ordenarPorHierarquia(members).map((m, i) => renderMemberRow(m, i)).join('');
}

// Tela cheia (nao um painel dentro do evento) com quem ja confirmou -
// mesmo visual da lista de membros (numero, nome, grau, selos de
// funcao/direto/destacado/acompanhado), mais a divisao embaixo, que so faz
// sentido aparecer aqui (na lista principal ja da pra ver pelo agrupamento).
function renderConfirmados(app) {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) { state.view = 'home'; return renderHome(app); }
  const members = ev.memberIds
    .map(id => state.roster.find(m => m.id === id))
    .filter(Boolean);
  const confirmados = ordenarPorHierarquia(members.filter(m => getMemberStatus(m.id).status === 'confirmado'));

  app.innerHTML = `
    <div class="back-link on-photo" data-action="close-confirmados">‹ ${escapeHtml(ev.nome)}</div>
    <div class="event-header">
      <h1>✅ Confirmados</h1>
      <div class="count-box">${confirmados.length}/${members.length} CONFIRMADOS</div>
    </div>
    <div class="card" style="padding: 4px 16px;">
      ${confirmados.length === 0 ? '<div class="empty">Ninguém confirmou ainda.</div>' : confirmados.map((m, i) => renderConfirmadoRow(m, i)).join('')}
    </div>
  `;
}

function renderConfirmadoRow(m, i) {
  const st = getMemberStatus(m.id);
  return `
    <div class="member-row">
      <div class="member-info-wrap">
        <div class="member-info">
          <span class="member-num">${String(i + 1).padStart(2, '0')}.</span>
          <span class="member-name">${escapeHtml(m.nome)}</span>
          ${m.grau ? `<span class="grade-box">${escapeHtml(m.grau)}</span>` : ''}
          ${st.direto ? '<span title="Direto">🚀</span>' : ''}
          ${st.destacado ? '<span title="Voluntário destacado">🚧</span>' : ''}
          ${st.acompanhado ? '<span title="Acompanhado">🐯</span>' : ''}
        </div>
        ${linhaFuncoes(m.funcoes)}
        <div class="confirmado-divisao">${escapeHtml(m.divisao || '—')}</div>
      </div>
    </div>

}

function renderEvent(app) {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) { state.view = 'home'; return renderHome(app); }
  const members = ev.memberIds
    .map(id => state.roster.find(m => m.id === id))
    .filter(Boolean);

  const hasInfo = ev.data || ev.horario || ev.endereco || ev.outros;
  const confirmados = members.filter(m => getMemberStatus(m.id).status === 'confirmado');

  app.innerHTML = `
    <div class="back-link on-photo" data-action="voltar-do-evento">‹ Todos os eventos</div>
    <div class="event-header">
      <h1>${escapeHtml(ev.nome)}</h1>
      <div class="event-header-row">
        <div class="count-box">${members.length} MEMBROS</div>
        <button class="confirm-toggle-btn" data-action="toggle-confirmados">
          ✅ ${confirmados.length}/${members.length}
        </button>
      </div>
    </div>
    ${hasInfo ? `
      <div class="card" style="margin-bottom: 16px;">
        ${ev.data ? `<div class="info-line">🗓️ ${formatDataBR(ev.data)}</div>` : ''}
        ${ev.horario ? `<div class="info-line">⏰ ${escapeHtml(ev.horario)}</div>` : ''}
        ${ev.endereco ? `<div class="info-line">📍 ${linkify(ev.endereco)}</div>` : ''}
        ${ev.outros ? `<div class="info-line" style="white-space: pre-wrap;">ℹ️ ${linkify(ev.outros)}</div>` : ''}
      </div>
    ` : ''}
    ${renderStatusBanner()}

      ${members.length === 0 ? '<div class="empty">Nenhum membro nesse evento.</div>' : renderListaMembros(ev, members)}

      ⚠️ Aguardando confirmação &nbsp; ✅ Presença confirmada<br>
      ❌ Falta (Família) &nbsp; ❌ Falta (Trabalho)<br>
      🚀 Direto (vai por conta própria) &nbsp; 🚧 Voluntário destacado<br>
      🐯 Acompanhado<br>
      ${FUNCOES.map(f => `${f.selo} ${escapeHtml(f.label)}`).join(' &nbsp; ')}
    </div>
  `;
}

// Enquanto a leitura nao confirma, a lista aparece esmaecida e nao aceita
// toque: o que esta na tela ainda nao e o dado real da planilha.
function renderStatusBanner() {
  if (state.statusError) {
    return `
      <div class="alert">
        <div class="alert-title">Não consegui carregar as confirmações</div>
        <div class="alert-msg">${escapeHtml(state.statusError)}.<br>A lista abaixo não é a de verdade, por isso está bloqueada.</div>
        <button class="btn secondary block" data-action="retry-status" style="margin-top:10px;">Tentar de novo</button>
      </div>
    `;
  }
  if (!state.statusLoaded) {
    return '<div class="alert info"><div class="alert-msg">Carregando as confirmações…</div></div>';
  }
  if (state.saveState === 'saving') {
    return '<div class="alert info"><div class="alert-msg">Salvando… pode continuar marcando.</div></div>';
  }
  if (state.saveState === 'saved') {
    return '<div class="alert ok"><div class="alert-msg">✅ Salvo na planilha</div></div>';
  }
  if (state.saveState === 'error') {
    return `
      <div class="alert">
        <div class="alert-title">Ainda não salvou</div>
        <div class="alert-msg">Suas marcações estão na tela, mas não chegaram na planilha.<br>Não feche antes de salvar.</div>
        <button class="btn secondary block" data-action="retry-save" style="margin-top:10px;">Tentar salvar de novo</button>
      </div>
    `;
  }
  return '';
}

  const isOpen = state.expandedMemberId === m.id;
  const travado = !state.statusLoaded;
  return `
    <div class="member-row${travado ? ' travado' : ''}">
      <div class="member-head" ${travado ? '' : `data-action="toggle-member" data-id="${m.id}"`}>
        <div class="member-info-wrap">
        <div class="member-info">
          <span class="member-num">${String(i + 1).padStart(2, '0')}.</span>
          <span class="member-name">${escapeHtml(m.nome)}</span>
          ${m.grau ? `<span class="grade-box">${escapeHtml(m.grau)}</span>` : ''}
          ${st.direto ? '<span title="Direto">🚀</span>' : ''}
          ${st.destacado ? '<span title="Voluntário destacado">🚧</span>' : ''}
          ${st.acompanhado ? '<span title="Acompanhado">🐯</span>' : ''}
        </div>
        ${linhaFuncoes(m.funcoes)}
        </div>
        <span class="status-badge status-${st.status}">${s.emoji} ${s.label}</span>

      <div class="picker ${isOpen ? 'open' : ''}">
        <div class="picker-group">
          ${STATUS_PICKER_KEYS.map(key => [key, STATUS[key]]).map(([key, val]) => `
            <button class="picker-btn ${st.status === key ? 'active' : ''}" data-action="set-status" data-id="${m.id}" data-status="${key}">
              ${val.emoji} ${val.label}
            </button>
          `).join('')}
        </div>
        <div class="toggle-row">
          <button class="toggle-chip ${st.direto ? 'active' : ''}" data-action="toggle-direto" data-id="${m.id}">🚀 Direto</button>
          <button class="toggle-chip ${st.destacado ? 'active' : ''}" data-action="toggle-destacado" data-id="${m.id}">🚧 Destacado</button>
          <button class="toggle-chip ${st.acompanhado ? 'active' : ''}" data-action="toggle-acompanhado" data-id="${m.id}">🐯 Acompanhado</button>
        </div>
      </div>
    </div>
  `;
}

    <div class="back-link on-photo" data-action="go-home">‹ Voltar</div>

function renderPin(app) {
  app.innerHTML = `
    <div class="back-link on-photo" data-action="go-divisoes">‹ Voltar</div>
    <div class="crest-wrap" style="margin-bottom: 8px;">
      <h1 style="font-size: 19px;">Modo organizador</h1>
    </div>
    <div class="card">
      <label>PIN de acesso</label>
      <input type="tel" inputmode="numeric" maxlength="4" class="pin-input" id="pin-field" placeholder="••••" autofocus ${state.pinVerificando ? 'disabled' : ''}>
      ${state.pinErro ? `<div style="color: #C9A29C; font-size: 13px; margin-bottom: 10px;">${escapeHtml(state.pinErro)}</div>` : ''}
      <button class="btn block" data-action="check-pin" ${state.pinVerificando ? 'disabled' : ''}>${state.pinVerificando ? 'Verificando…' : 'Entrar'}</button>
    </div>
  `;
  const field = document.getElementById('pin-field');
  if (field) {
    field.focus();
    field.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPin(); });
  }
}

// O PIN nunca e comparado no navegador - so o servidor sabe o valor certo.
// A pagina manda o que foi digitado e recebe de volta so um sim/nao.
async function checkPin() {
  if (state.pinVerificando) return;
  const val = document.getElementById('pin-field').value.trim();
  if (!val) return;
  state.pinVerificando = true;
  state.pinErro = null;
  render();
  try {
    const r = await api('verificarPin', { escopo: state.adminEscopo, pin: val });
    if (r.valido) {
      state.isAdmin = true;
      state.view = 'admin';
      state.adminTab = 'eventos';
    } else {
      state.pinErro = 'PIN incorreto.';
    }
  } catch (e) {
    state.pinErro = 'Não consegui verificar (' + e.message + '). Tente de novo.';
  }
  state.pinVerificando = false;
  render();
}

// Tela "Calendario" - escolhe a divisao/regional (sem PIN, igual Eventos),
// depois mostra a grade do mes daquele escopo. Por enquanto so mostra os
// dias - o que cada dia vai destacar (eventos, etc.) fica pra depois.

// Seg,Ter,Qua,Qui,Sex,Sab,Dom - so a primeira letra, igual pedido (repete
// letra pra Q e S de proposito, o cabecalho da coluna ja deixa claro qual
// dia da semana e cada uma pela posicao).
const DIAS_SEMANA_LETRA = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
const NOMES_MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

// Grade de um mes, semana Segunda-a-Domingo: null nas celulas antes do dia 1
// ou depois do ultimo dia, pra completar sempre um numero de semanas
// inteiras (multiplo de 7).
function construirGradeCalendario(ano, mes) {
  const primeiroDia = new Date(ano, mes, 1);
  const totalDias = new Date(ano, mes + 1, 0).getDate();
  const offsetInicio = (primeiroDia.getDay() + 6) % 7; // getDay(): 0=domingo - vira 0=segunda
  const celulas = [];
  for (let i = 0; i < offsetInicio; i++) celulas.push(null);
  for (let dia = 1; dia <= totalDias; dia++) celulas.push(dia);
  while (celulas.length % 7 !== 0) celulas.push(null);
  return celulas;
}

// Le linhas "DD/MM - Tipo" coladas na tela "Organizar" do Calendario e
// devolve um mapa 'yyyy-mm-dd' -> tipo. Reconhece o tipo do mesmo jeito que
// o parser de convocacao (parseConvocacaoTexto): bate por palavra (ignorando
// "e"/"de"), tolera acentos e maiuscula/minuscula, entao "PUb" ou
// "bate volta" batem igual. ano vem sempre de fora (o ano do calendario em
// exibicao) - o texto colado so tem dia/mes, nunca ano.
// O separador entre data e tipo e opcional - aceita "01/09 - Pub",
// "01/09 Pub" e ate "01/09Pub" (colado sem espaço nenhum, sem querer) -
// \s*[-–:]?\s* casa qualquer uma das tres formas, inclusive nenhum
// caractere entre a data e o tipo.
function parseTextoOrganizarCalendario(texto, ano) {
  const marcacoes = {};
  const naoReconhecidas = [];
  String(texto || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(linha => {
    const m = linha.match(/^(\d{1,2})\s*\/\s*(\d{1,2})\s*[-–:]?\s*(.+)$/);
    const dia = m && Number(m[1]);
    const mes = m && Number(m[2]);
    const valido = !!m && dia >= 1 && dia <= 31 && mes >= 1 && mes <= 12;
    const tipoTexto = valido ? normalizarNome(m[3]) : '';
    const tipoAchado = valido && TIPOS_EVENTO.find(t => {
      const tokens = normalizarNome(t).split(' ').filter(tok => tok && tok !== 'e' && tok !== 'de');
      return tokens.every(tok => tipoTexto.includes(tok));
    });
    if (!valido || !tipoAchado) { naoReconhecidas.push(linha); return; }
    marcacoes[`${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`] = tipoAchado;
  });
  return { marcacoes, naoReconhecidas };
}

// Regional enxerga tudo (o proprio + o que cada divisao marcou) - uma
// divisao enxerga so o proprio + o que o Regional marcou (vale pra todo
// mundo). Uma divisao nunca ve o que outra divisao marcou.
// Cada data devolvida vem com { tipo, origem } - origem e a chave de quem
// marcou (uma divisao, ou 'regional') - usado so pra rotular de qual
// divisao e o evento quando visto pelo calendario Regional (ver
// renderCalendario). Uma divisao nunca precisa dessa info pra si mesma.
// Eventos com tipo marcado (os que a tela "Organizar" cria/mostra) visiveis
// num escopo do calendario - Regional ve o proprio + o de todas as
// divisoes; uma divisao ve o proprio + o que o Regional marcou (vale pra
// todo mundo), nunca o que outra divisao marcou. Eventos sem tipo (ex: um
// evento antigo criado manualmente sem selecionar tipo) nao aparecem no
// calendario - continuam existindo normalmente na aba Eventos.
function eventosCalendarioVisiveis(chaveEscopo) {
  if (chaveEscopo === 'regional') return state.events.filter(ev => ev.tipo);
  return state.events.filter(ev => ev.tipo && (ev.categoria === chaveEscopo || ev.categoria === 'regional'));
}

// Membros convidados quando um evento nasce da tela "Organizar" do
// Calendario - mesmo criterio de membrosElegiveisEvento() (Modo
// organizador): Regional convida todo mundo, uma divisao so os proprios.
function membrosElegiveisCalendario(chaveEscopo) {
  if (chaveEscopo === 'regional') return state.roster;
  const nomeDivisao = escopoPorChave(chaveEscopo).nome;
  return state.roster.filter(m => m.divisao === nomeDivisao);
}

// Mapa 'yyyy-mm-dd' -> { tipo, origem, id } pra desenhar a grade do
// calendario (renderCalendario) - origem e a categoria do evento (uma
// divisao, ou 'regional'), usada so pro rotulo de origem.
function marcacoesVisiveisCalendario(chaveEscopo) {
  const mapa = {};
  eventosCalendarioVisiveis(chaveEscopo).forEach(ev => {
    if (ev.data) mapa[ev.data] = { tipo: ev.tipo, origem: ev.categoria, id: ev.id };
  });
  return mapa;
}

        <button class="btn ghost" data-action="calendario-mes-seguinte">›</button>
      </div>
      <div class="calendario-grade">
        ${DIAS_SEMANA_LETRA.map(l => `<div class="calendario-dia-semana">${l}</div>`).join('')}
        ${celulas.map(dia => {

// Calendario replicado, so com os eventos que a propria divisao/regional
// criou (categoria === o proprio escopo, sem o merge de
// eventosCalendarioVisiveis/marcacoesVisiveisCalendario) - so da pra
// editar/excluir o que essa mesma divisao criou, igual so da pra ver isso
// na tela normal do calendario; um evento do Regional nao pode ser editado
// a partir de uma divisao, e vice-versa.
function conteudoCalendarioOrganizarEditar() {
  const hoje = new Date();
  if (state.calendarioAno === null) state.calendarioAno = hoje.getFullYear();
  if (state.calendarioMes === null) state.calendarioMes = hoje.getMonth();

  const celulas = construirGradeCalendario(state.calendarioAno, state.calendarioMes);
  // O Regional enxerga e edita/exclui QUALQUER evento (o proprio + o de
  // qualquer divisao) - o PIN Regional ja e chave-mestra no resto do app
  // (verificarPin), entao faz sentido valer aqui tambem. Uma divisao so
  // edita/exclui o que ela propria criou (categoria === o proprio escopo) -
  // nunca um evento do Regional nem de outra divisao.
  const marcacoesProprias = {};
  (state.calendarioEscopo === 'regional'
    ? eventosCalendarioVisiveis('regional')
    : eventosCalendarioVisiveis(state.calendarioEscopo).filter(ev => ev.categoria === state.calendarioEscopo)
  ).forEach(ev => { marcacoesProprias[ev.data] = ev; });
  const ehHoje = (dia) => dia === hoje.getDate() && state.calendarioMes === hoje.getMonth() && state.calendarioAno === hoje.getFullYear();
  const dataSelecionada = state.calendarioEditandoData;
  const eventoSelecionado = dataSelecionada ? marcacoesProprias[dataSelecionada] : null;

  return `
    <div class="card calendario-card">
      <div class="calendario-cabecalho">
        <button class="btn ghost" data-action="calendario-mes-anterior">‹</button>
        <div class="calendario-titulo">${NOMES_MESES[state.calendarioMes]} de ${state.calendarioAno}</div>
        <button class="btn ghost" data-action="calendario-mes-seguinte">›</button>
      </div>
      <div class="calendario-grade">
        ${DIAS_SEMANA_LETRA.map(l => `<div class="calendario-dia-semana">${l}</div>`).join('')}
        ${celulas.map(dia => {
          if (dia === null) return '<div class="calendario-dia calendario-dia-vazio"></div>';
          const dataIso = `${state.calendarioAno}-${String(state.calendarioMes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
          const evento = marcacoesProprias[dataIso];
          const tipo = evento && evento.tipo;
          const estilo = tipo ? `border-color:${corTipoEvento(tipo)}; background:${hexParaRgba(corTipoEvento(tipo), 0.18)};` : '';
          const classes = ['calendario-dia'];
          if (ehHoje(dia)) classes.push('calendario-dia-hoje');
          if (tipo) classes.push('calendario-dia-clicavel');
          if (dataIso === dataSelecionada) classes.push('calendario-dia-selecionado');
          // So aparece no Regional (unico escopo que edita evento de outra
          // origem) - pra saber de qual divisao e o evento antes de tocar.
          const nomeOrigem = tipo && evento.categoria !== state.calendarioEscopo
            ? (evento.categoria === 'regional' ? 'Regional' : escopoPorChave(evento.categoria).nome.split(' - ')[0])
            : '';
          return `
            <div class="${classes.join(' ')}" style="${estilo}" ${tipo ? `data-action="calendario-editar-selecionar-dia" data-value="${dataIso}"` : ''} title="${tipo ? escapeHtml(tipo + (nomeOrigem ? ' - ' + nomeOrigem : '')) : ''}">
              <span class="calendario-dia-numero">${dia}</span>
              ${tipo ? `<span class="calendario-dia-emoji">${emojiTipoEvento(tipo)}</span>` : ''}
              ${nomeOrigem ? `<span class="calendario-dia-origem">${escapeHtml(nomeOrigem)}</span>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
    ${eventoSelecionado ? renderCalendarioEditorPainel(eventoSelecionado) : `
      <div class="empty" style="margin-top:10px;">Toque num dia marcado pra ajustar a data ou remover.</div>
    `}
  `;
}

function renderCalendarioEditorPainel(evento) {
  const [ano, mes, dia] = evento.data.split('-');
  const tipo = evento.tipo;
  // So o Regional edita evento de outra origem - mostra de qual divisao e,
  // pra nao confundir "excluir o evento errado" com um evento parecido da
  // propria divisao.
  const origemTexto = evento.categoria !== state.calendarioEscopo
    ? ` (${evento.categoria === 'regional' ? 'Regional' : escopoPorChave(evento.categoria).nome.split(' - ')[0]})`
    : '';
  const titulo = `${emojiTipoEvento(tipo)} ${escapeHtml(tipo)} - ${dia}/${mes}/${ano}${escapeHtml(origemTexto)}`;
  if (state.calendarioAjustandoData) {
    return `
      <div class="card" style="margin-top:12px;">
        <div style="font-weight:600; margin-bottom:8px;">${titulo}</div>
        <label>Nova data</label>
        <input type="date" id="calendario-editar-data-field" value="${evento.data}">
        <div class="row-gap" style="margin-top:10px;">
          <button class="btn block" data-action="calendario-editar-confirmar-data" data-id="${evento.id}">Confirmar</button>
          <button class="btn secondary" data-action="calendario-editar-cancelar-ajuste">Cancelar</button>
        </div>
      </div>
    `;
  }
  if (state.calendarioConfirmandoExclusao) {
    return `
      <div class="alert" style="margin-top:12px;">
        <div class="alert-title">Excluir ${escapeHtml(tipo)} de ${dia}/${mes}/${ano}${escapeHtml(origemTexto)}?</div>
        <div class="alert-msg">Apaga o evento e as confirmações de todos os membros. Não dá para desfazer.</div>
        <div class="row-gap" style="margin-top:10px;">
          <button class="btn danger" data-action="calendario-editar-excluir" data-id="${evento.id}">Sim, excluir</button>
          <button class="btn secondary" data-action="calendario-editar-cancelar-exclusao">Cancelar</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="card" style="margin-top:12px;">
      <div style="font-weight:600; margin-bottom:8px;">${titulo}</div>
      <div class="row-gap">
        <button class="btn secondary" data-action="calendario-editar-abrir-ajuste">📅 Ajustar data</button>
        <button class="btn danger" data-action="calendario-editar-pedir-exclusao">🗑️ Excluir</button>
      </div>
    </div>
  `;
}
